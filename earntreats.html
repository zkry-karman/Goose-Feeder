<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Earn treats — Feed a Goose</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
:root{
  --ink:#141019; --surface:#1d1825; --surface-2:#272031; --line:#352c44;
  --text:#f1ecf6; --muted:#a196b3; --accent:#ffb454; --accent-ink:#2a1a02;
  --ok:#66d9a0; --live:#ff5c72;
  --radius-lg:22px; --radius:14px; --shell:1180px; --content:760px;
}
*{box-sizing:border-box}
body{
  margin:0;
  background:
    radial-gradient(1100px 600px at 12% -8%, #2b2038 0%, transparent 60%),
    radial-gradient(900px 520px at 92% 0%, #1f2a33 0%, transparent 55%),
    var(--ink);
  background-attachment:fixed;
  color:var(--text);
  font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;
  font-size:15px;line-height:1.6;-webkit-font-smoothing:antialiased;
}
h1,h2,h3{font-family:"Bricolage Grotesque",Inter,system-ui,sans-serif;font-weight:700;letter-spacing:-0.02em;margin:0}
button,a{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:6px}

.topbar{position:sticky;top:0;z-index:60;backdrop-filter:blur(14px);background:rgba(20,16,25,.78);border-bottom:1px solid var(--line)}
.topbar-inner{max-width:var(--shell);margin:0 auto;padding:12px 20px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;margin-right:auto;min-width:0;text-decoration:none;color:inherit}
.brand-mark{width:36px;height:36px;flex:none;border-radius:12px;background:linear-gradient(150deg,var(--accent),#ff8a6b);display:grid;place-items:center;font-size:19px;box-shadow:0 6px 18px rgba(255,180,84,.22)}
.brand-name{font-family:"Bricolage Grotesque",sans-serif;font-weight:800;font-size:1.12rem;letter-spacing:-.03em}
.brand-sub{display:block;font-size:.74rem;color:var(--muted);font-weight:500}
.icon-btn{display:grid;place-items:center;width:36px;height:36px;border-radius:999px;background:var(--surface-2);border:1px solid var(--line);color:var(--text);text-decoration:none}
.icon-btn:hover{background:#32293e}
.token-badge{display:inline-flex;align-items:center;gap:6px;background:var(--surface-2);border:1px solid var(--line);border-radius:999px;padding:6px 14px;font-size:.84rem;font-weight:700}

.shell{max-width:var(--content);margin:0 auto;padding:50px 20px 90px;text-align:center}
.badge-soon{display:inline-flex;align-items:center;gap:7px;background:rgba(255,180,84,.14);color:var(--accent);border:1px solid rgba(255,180,84,.32);border-radius:999px;padding:6px 16px;font-size:.78rem;font-weight:700;letter-spacing:.05em;text-transform:uppercase;margin-bottom:18px}
.shell h1{font-size:2rem;margin-bottom:10px}
.lede{color:var(--muted);font-size:.94rem;max-width:440px;margin:0 auto 34px}

.games-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:16px;text-align:left}
.game-card{
  background:var(--surface);border:1px solid var(--line);border-radius:18px;
  padding:20px;cursor:pointer;transition:transform .15s ease,border-color .15s ease;
}
.game-card:hover{transform:translateY(-3px);border-color:#4a3d5d}
.game-icon{font-size:2.1rem;margin-bottom:10px}
.game-name{font-weight:800;font-family:"Bricolage Grotesque",sans-serif;font-size:1.02rem}
.game-desc{font-size:.78rem;color:var(--muted);margin-top:4px}
.game-card.disabled{opacity:.4;cursor:default}
.game-card.disabled:hover{transform:none;border-color:var(--line)}

/* ---------- game modal (shared shell — every game renders inside #gameBody) ---------- */
.game-overlay{
  position:fixed;inset:0;z-index:300;display:none;
  background:rgba(8,6,11,.8);backdrop-filter:blur(5px);
  align-items:center;justify-content:center;padding:18px;
}
.game-overlay.open{display:flex}
.game-window{
  width:100%;max-width:480px;background:var(--surface);
  border:1px solid var(--line);border-radius:20px;overflow:hidden;
  display:flex;flex-direction:column;max-height:92vh;
}
.game-window:fullscreen{max-width:none;max-height:none;height:100%;border-radius:0}
.game-topbar{
  display:flex;align-items:center;justify-content:space-between;
  padding:11px 14px;border-bottom:1px solid var(--line);background:var(--surface-2);flex:none;
}
.game-topbar .title{font-family:"Bricolage Grotesque",sans-serif;font-weight:800;font-size:.95rem;display:flex;align-items:center;gap:7px}
.game-topbar-actions{display:flex;gap:6px}
.gt-btn{width:30px;height:30px;border-radius:9px;border:1px solid var(--line);background:var(--surface);color:var(--text);cursor:pointer;font-size:.95rem;display:grid;place-items:center}
.gt-btn:hover{background:#32293e}

.game-body{flex:1;overflow-y:auto;padding:22px;display:flex;flex-direction:column;align-items:center;gap:16px}

.gscreen{width:100%;display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center}
.gscreen h2{font-size:1.3rem}
.gscreen p{color:var(--muted);font-size:.87rem;max-width:300px}
.g-btn{border:none;border-radius:999px;padding:12px 26px;font-weight:800;font-size:.95rem;cursor:pointer;font-family:"Bricolage Grotesque",sans-serif}
.g-btn.primary{background:var(--accent);color:var(--accent-ink)}
.g-btn.primary:hover{background:#ffc470}
.g-btn.ghost{background:var(--surface-2);color:var(--text);border:1px solid var(--line)}
.g-btn.ghost:hover{background:#32293e}
.g-row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}

.how-list{text-align:left;color:var(--text);font-size:.87rem;max-width:300px;margin:0;padding-left:20px;line-height:1.7}
.how-list li{margin-bottom:4px}

.hud{display:flex;gap:14px;font-size:.82rem;color:var(--muted);align-items:center}
.hud b{color:var(--text);font-weight:800}
.hud .fish-badge{color:var(--accent);font-weight:800}

.countdown{
  font-family:"Bricolage Grotesque",sans-serif;font-weight:800;
  font-size:4.5rem;color:var(--accent);
  animation:countPulse .5s ease;
}
@keyframes countPulse{from{transform:scale(1.35);opacity:0}to{transform:scale(1);opacity:1}}

canvas#catnakeCanvas{
  background:
    repeating-conic-gradient(#241d2c 0% 25%, #2a2233 0% 50%) 0 0/50px 50px;
  border-radius:12px;border:1px solid var(--line);
  image-rendering:pixelated;max-width:100%;height:auto;
}
.dpad{display:grid;grid-template-columns:repeat(3,48px);grid-template-rows:repeat(3,48px);gap:6px;margin-top:2px}
.dpad button{background:var(--surface-2);border:1px solid var(--line);border-radius:12px;color:var(--text);font-size:1.1rem;cursor:pointer}
.dpad button:active{background:#32293e}
.dpad .up{grid-column:2;grid-row:1}
.dpad .left{grid-column:1;grid-row:2}
.dpad .right{grid-column:3;grid-row:2}
.dpad .down{grid-column:2;grid-row:3}

.sign-in-note{font-size:.78rem;color:var(--accent);text-align:center}
.sign-in-note a{color:inherit;text-decoration:underline}

@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<header class="topbar">
  <div class="topbar-inner">
    <a class="brand" href="index.html">
      <span class="brand-mark">🐈‍⬛</span>
      <span>
        <span class="brand-name">Feed a Goose</span>
        <span class="brand-sub">can you feed goose pls</span>
      </span>
    </a>
    <span class="token-badge" id="tokenBadge" style="display:none">🐟 <span id="tokenCount">0</span></span>
    <a href="index.html" class="icon-btn" aria-label="Home">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M4 11.5 12 4l8 7.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M6.5 10v9.5a1 1 0 0 0 1 1H10a1 1 0 0 0 1-1V15h2v4.5a1 1 0 0 0 1 1h2.5a1 1 0 0 0 1-1V10" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </a>
  </div>
</header>

<main class="shell">
  <span class="badge-soon">🚧 More on the way</span>
  <h1>Earn treats</h1>
  <p class="lede">Play a few little games, earn 🐟 tokens, feed Goose for free. Every 3rd salmon banks you one treat.</p>

  <div class="games-grid">
    <div class="game-card" id="catnakeCard">
      <div class="game-icon">🐈‍⬛🐟</div>
      <div class="game-name">CATnake</div>
      <div class="game-desc">Classic snake. Black cat, salmon, 8×8 grid.</div>
    </div>
    <div class="game-card disabled">
      <div class="game-icon">🧩</div>
      <div class="game-name">???</div>
      <div class="game-desc">Coming soon.</div>
    </div>
    <div class="game-card disabled">
      <div class="game-icon">🎯</div>
      <div class="game-name">???</div>
      <div class="game-desc">Coming soon.</div>
    </div>
  </div>
</main>

<!-- ================= GAME MODAL (shared shell for every game) ================= -->
<div class="game-overlay" id="gameOverlay">
  <div class="game-window" id="gameWindow">
    <div class="game-topbar">
      <span class="title" id="gameTitle"></span>
      <div class="game-topbar-actions">
        <button class="gt-btn" id="fsBtn" title="Fullscreen">⛶</button>
        <button class="gt-btn" id="exitBtn" title="Exit">✕</button>
      </div>
    </div>
    <div class="game-body" id="gameBody"><!-- the open game renders its screens here --></div>
  </div>
</div>

<script>
/* ============================================================
   PAGE-LEVEL: session state + the shared modal shell.
   Individual games (in /games/*.js) only ever talk to these two
   globals — they never touch the page's own DOM directly, so
   dropping in a new game file later never risks breaking another.
   ============================================================ */
window.Session = { loggedIn: false, username: null, tokens: 0 };

async function loadSession(){
  try{
    const r = await fetch("/api/me");
    const d = await r.json();
    Session.loggedIn = !!d.loggedIn;
    Session.username = d.username || null;
    Session.tokens = d.tokens || 0;
  }catch(e){ Session.loggedIn = false; }

  const badge = document.getElementById("tokenBadge");
  if(Session.loggedIn){
    badge.style.display = "inline-flex";
    document.getElementById("tokenCount").textContent = Session.tokens;
  }
}

window.GameModal = {
  open(titleHtml){
    document.getElementById("gameTitle").innerHTML = titleHtml;
    document.getElementById("gameOverlay").classList.add("open");
  },
  close(){
    document.getElementById("gameOverlay").classList.remove("open");
    if(document.fullscreenElement) document.exitFullscreen().catch(() => {});
  },
  body(){
    return document.getElementById("gameBody");
  }
};

document.getElementById("exitBtn").addEventListener("click", () => {
  window.activeGame?.stop?.();
  window.activeGame = null;
  window.GameModal.close();
});

document.getElementById("fsBtn").addEventListener("click", () => {
  const win = document.getElementById("gameWindow");
  if(!document.fullscreenElement){
    win.requestFullscreen?.().catch(() => {});
  }else{
    document.exitFullscreen();
  }
});
document.addEventListener("fullscreenchange", () => {
  document.getElementById("fsBtn").textContent = document.fullscreenElement ? "⤢" : "⛶";
});

document.getElementById("catnakeCard").addEventListener("click", () => CATnake.open());

window.addEventListener("DOMContentLoaded", loadSession);
</script>

<!-- Each game lives in its own file under /games — add new <script> tags here as more are built -->
<script src="games/catnake.js"></script>
</body>
</html>
