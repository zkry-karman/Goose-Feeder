<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Feature your cat — Feed a Goose</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="theme.css">

<style>
:root{
  --radius-lg:22px;
  --radius:14px;
  --shell:1180px;
  --content:560px;
}
*{box-sizing:border-box}
body{
  margin:0;
  background:
    radial-gradient(1100px 600px at 12% -8%, rgba(255,255,255,.65) 0%, transparent 60%),
    radial-gradient(900px 520px at 92% 0%, rgba(255,255,255,.35) 0%, transparent 55%),
    var(--ink);
  background-attachment:fixed;
  color:var(--text);
  font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;
  font-size:15px;line-height:1.6;-webkit-font-smoothing:antialiased;
}
h1,h2,h3{font-family:"Bricolage Grotesque",Inter,system-ui,sans-serif;font-weight:700;letter-spacing:-0.02em;margin:0}
button,input,textarea,a{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:6px}

.topbar{position:sticky;top:0;z-index:60;backdrop-filter:blur(14px);background:var(--glass);border-bottom:1px solid var(--line)}
.topbar-inner{max-width:var(--shell);margin:0 auto;padding:12px 20px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;margin-right:auto;min-width:0;text-decoration:none;color:inherit}
.brand-mark img{width:100%;height:100%;object-fit:cover;border-radius:inherit;display:block}
.brand-mark{overflow:hidden;width:36px;height:36px;flex:none;border-radius:12px;background:linear-gradient(150deg,var(--accent),var(--accent-2));display:grid;place-items:center;font-size:19px;box-shadow:0 6px 18px rgba(255,92,35,.22)}
.brand-name{font-family:"Bricolage Grotesque",sans-serif;font-weight:800;font-size:1.12rem;letter-spacing:-.03em}
.brand-sub{display:block;font-size:.74rem;color:var(--muted);font-weight:500}
.icon-btn{display:grid;place-items:center;width:36px;height:36px;border-radius:999px;background:var(--surface-2);border:1px solid var(--line);color:var(--text);text-decoration:none}
.icon-btn:hover{background:var(--hover)}

.shell{max-width:var(--content);margin:0 auto;padding:44px 20px 90px}
.eyebrow{font-size:.8rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--accent-text);margin-bottom:10px}
.shell h1{font-size:1.9rem;margin-bottom:8px}
.lede{color:var(--muted);font-size:.92rem;margin-bottom:24px}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-lg);padding:26px}

.gate{text-align:center;padding:20px 6px}
.gate a{color:var(--accent-text);font-weight:600;text-decoration:none}
.gate a:hover{text-decoration:underline}

form{display:flex;flex-direction:column;gap:16px}
.field-label{font-size:.78rem;color:var(--muted);font-weight:600}
input[type=text],input[type=number],textarea{
  width:100%;background:var(--surface-2);border:1px solid var(--line);
  border-radius:var(--radius);padding:12px 14px;font-size:.94rem;
}
input:focus,textarea:focus{border-color:var(--line-strong);outline:none}
textarea{min-height:110px;resize:vertical;line-height:1.5}

.photo-picker{
  border:1.5px dashed var(--line);border-radius:var(--radius);
  padding:18px;text-align:center;cursor:pointer;position:relative;overflow:hidden;
  background:var(--surface-2);transition:border-color .15s ease;
}
.photo-picker:hover{border-color:var(--line-strong)}
.photo-picker input{position:absolute;inset:0;opacity:0;cursor:pointer}
.photo-picker .hint-text{font-size:.85rem;color:var(--muted)}
.photo-preview{width:100%;max-height:260px;object-fit:contain;border-radius:10px;display:none;margin-top:10px}

.btn{border:none;border-radius:999px;padding:12px 20px;font-size:.94rem;font-weight:700;cursor:pointer;transition:background .15s ease,transform .12s ease}
.btn-primary{background:var(--accent);color:var(--accent-ink)}
.btn-primary:hover{background:var(--accent-hover)}
.btn-primary:disabled{opacity:.5;cursor:not-allowed}
.btn-ghost{background:var(--surface-2);color:var(--text);border:1px solid var(--line);text-decoration:none;display:inline-block;text-align:center}
.btn-ghost:hover{background:var(--hover)}

.done{text-align:center;padding:14px 4px}
.done .big{font-size:2.4rem;display:block;margin-bottom:10px}
.done p{color:var(--muted);margin:8px 0 22px}

#toasts{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);z-index:200;display:flex;flex-direction:column;gap:9px;align-items:center;width:calc(100% - 32px);max-width:400px}
.toast{background:var(--surface-2);border:1px solid var(--line);border-radius:14px;padding:11px 17px;font-size:.88rem;font-weight:500;box-shadow:0 12px 30px rgba(15,34,51,.16)}
.toast.good{border-color:var(--ok-line)}
.toast.bad{border-color:rgba(216,30,69,.4)}
</style>
</head>
<body>

<header class="topbar">
  <div class="topbar-inner">
    <a class="brand" href="index.html">
      <span class="brand-mark">🐈‍⬛</span>
      <span>
        <span class="brand-name">Feed a Goose</span>
        <span class="brand-sub">a wall for cats, by cats</span>
      </span>
    </a>
    <a href="index.html" class="icon-btn" aria-label="Home">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M4 11.5 12 4l8 7.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M6.5 10v9.5a1 1 0 0 0 1 1H10a1 1 0 0 0 1-1V15h2v4.5a1 1 0 0 0 1 1h2.5a1 1 0 0 0 1-1V10" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </a>
  </div>
</header>

<main class="shell">
  <div class="eyebrow">✨ Cat of the Week</div>
  <h1>Feature your cat</h1>
  <p class="lede">One photo, a few details — the moderator picks a winner each week.</p>

  <div class="panel" id="panel">
    <div class="gate">Checking your sign-in…</div>
  </div>
</main>

<div id="toasts"></div>

<script>
function esc(s){
  return String(s ?? "").replace(/[&<>'"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;","'":"&#39;",'"':"&quot;"}[c]));
}
function toast(msg, kind=""){
  const el = document.createElement("div");
  el.className = "toast " + kind;
  el.textContent = msg;
  document.getElementById("toasts").appendChild(el);
  setTimeout(() => el.remove(), 3600);
}

function renderGate(){
  document.getElementById("panel").innerHTML = `
    <div class="gate">
      Sign in on <a href="index.html">the wall</a> first to submit your cat.
    </div>`;
}

function renderForm(){
  document.getElementById("panel").innerHTML = `
    <form id="applyForm">
      <div>
        <div class="field-label">Cat's name</div>
        <input type="text" name="cat_name" required maxlength="40">
      </div>
      <div>
        <div class="field-label">Breed (optional)</div>
        <input type="text" name="breed" maxlength="60">
      </div>
      <div>
        <div class="field-label">Age (optional)</div>
        <input type="text" name="age" maxlength="20" placeholder="e.g. 3 years, or a kitten">
      </div>
      <div>
        <div class="field-label">Tell us about them</div>
        <textarea name="description" required maxlength="600" placeholder="What makes them special?"></textarea>
      </div>
      <div>
        <div class="field-label">Photo</div>
        <label class="photo-picker" id="picker">
          <span class="hint-text" id="pickerHint">Tap to choose a photo</span>
          <input type="file" name="photo" accept="image/*" id="photoInput" required>
          <img class="photo-preview" id="preview" alt="">
        </label>
      </div>
      <button type="submit" class="btn btn-primary" id="submitBtn">Submit for consideration</button>
    </form>`;

  const input = document.getElementById("photoInput");
  const preview = document.getElementById("preview");
  const hint = document.getElementById("pickerHint");
  input.addEventListener("change", () => {
    const file = input.files[0];
    if(!file) return;
    preview.src = URL.createObjectURL(file);
    preview.style.display = "block";
    hint.textContent = file.name;
  });

  document.getElementById("applyForm").addEventListener("submit", submitApplication);
}

function renderDone(){
  document.getElementById("panel").innerHTML = `
    <div class="done">
      <span class="big">🎉</span>
      <h2>Submitted!</h2>
      <p>Check back to see if your cat gets crowned.</p>
      <a href="index.html" class="btn btn-ghost">← Back to the wall</a>
    </div>`;
}

async function submitApplication(event){
  event.preventDefault();
  const form = event.target;
  const btn = document.getElementById("submitBtn");
  if(!document.getElementById("photoInput").files[0]){
    return toast("Please attach a photo.", "bad");
  }
  btn.disabled = true;
  btn.textContent = "Submitting…";
  try{
    const r = await fetch("/api/cat-of-week/apply", { method: "POST", body: new FormData(form) });
    const d = await r.json();
    if(!r.ok) throw new Error(d.message || "Something went wrong.");
    renderDone();
  }catch(e){
    toast(e.message || "Can't reach the server.", "bad");
    btn.disabled = false;
    btn.textContent = "Submit for consideration";
  }
}

window.addEventListener("DOMContentLoaded", async () => {
  try{
    const r = await fetch("/api/me");
    const me = await r.json();
    me.loggedIn ? renderForm() : renderGate();
  }catch(e){
    renderGate();
  }
});
</script>
</body>
</html>
