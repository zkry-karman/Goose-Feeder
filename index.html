<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Feed a Goose</title>

<link href="https://vjs.zencdn.net/8.10.0/video-js.css" rel="stylesheet">
<script src="https://vjs.zencdn.net/8.10.0/video.min.js"></script>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
:root{
  --ink:#141019;
  --surface:#1d1825;
  --surface-2:#272031;
  --line:#352c44;
  --text:#f1ecf6;
  --muted:#a196b3;
  --accent:#ffb454;
  --accent-ink:#2a1a02;
  --live:#ff5c72;
  --ok:#66d9a0;
  --radius-lg:22px;
  --radius:14px;
  --radius-sm:10px;
  --shell:1180px;
}

*{box-sizing:border-box}

html{-webkit-text-size-adjust:100%}

body{
  margin:0;
  background:
    radial-gradient(1100px 600px at 12% -8%, #2b2038 0%, transparent 60%),
    radial-gradient(900px 520px at 92% 0%, #1f2a33 0%, transparent 55%),
    var(--ink);
  background-attachment:fixed;
  color:var(--text);
  font-family:Inter,"Noto Sans SC","Noto Sans JP","PingFang SC","Hiragino Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  font-size:15px;
  line-height:1.55;
  -webkit-font-smoothing:antialiased;
}

h1,h2,h3{
  font-family:"Bricolage Grotesque",Inter,system-ui,sans-serif;
  font-weight:700;
  letter-spacing:-0.02em;
  margin:0;
}

button,input,textarea,select{font:inherit;color:inherit}

:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:6px}

/* ---------- top bar ---------- */
.topbar{
  position:sticky;top:0;z-index:60;
  backdrop-filter:blur(14px);
  background:rgba(20,16,25,.78);
  border-bottom:1px solid var(--line);
}
.topbar-inner{
  max-width:var(--shell);margin:0 auto;padding:12px 20px;
  display:flex;align-items:center;gap:14px;flex-wrap:wrap;
}
.brand{display:flex;align-items:center;gap:10px;margin-right:auto;min-width:0}
.brand-mark{
  width:36px;height:36px;flex:none;border-radius:12px;
  background:linear-gradient(150deg,var(--accent),#ff8a6b);
  display:grid;place-items:center;font-size:19px;
  box-shadow:0 6px 18px rgba(255,180,84,.22);
}
.brand-name{font-family:"Bricolage Grotesque",sans-serif;font-weight:800;font-size:1.12rem;letter-spacing:-.03em}
.brand-sub{display:block;font-size:.74rem;color:var(--muted);font-weight:500;letter-spacing:0}

.lang-wrap{position:relative;display:flex;align-items:center}
.lang-wrap svg{position:absolute;right:11px;pointer-events:none;opacity:.6}
select.lang{
  appearance:none;-webkit-appearance:none;
  background:var(--surface-2);border:1px solid var(--line);
  border-radius:999px;padding:8px 30px 8px 14px;
  font-size:.86rem;font-weight:600;cursor:pointer;
}
select.lang:hover{border-color:#4a3d5d}

.btn{
  border:1px solid transparent;border-radius:999px;
  padding:9px 18px;font-size:.88rem;font-weight:600;
  background:var(--surface-2);color:var(--text);
  cursor:pointer;transition:transform .12s ease,background .15s ease,border-color .15s ease;
}
.btn:hover{background:#32293e}
.btn:active{transform:translateY(1px)}
.btn-ghost{background:transparent;border-color:var(--line)}
.btn-ghost:hover{background:var(--surface-2)}
.btn-primary{background:var(--accent);color:var(--accent-ink)}
.btn-primary:hover{background:#ffc470}
.btn-sm{padding:6px 13px;font-size:.82rem}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none}

.badge{
  display:inline-flex;align-items:center;gap:7px;
  background:var(--surface-2);border:1px solid var(--line);
  border-radius:999px;padding:6px 14px;font-size:.84rem;font-weight:600;
}
.badge .fish{color:var(--accent)}

/* ---------- layout ---------- */
.shell{max-width:var(--shell);margin:0 auto;padding:26px 20px 80px}
.grid{display:grid;grid-template-columns:1fr;gap:22px}
@media(min-width:960px){
  .grid{grid-template-columns:minmax(0,420px) minmax(0,1fr);align-items:start}
  .col-left{position:sticky;top:78px}
}

.panel{
  background:var(--surface);
  border:1px solid var(--line);
  border-radius:var(--radius-lg);
  padding:18px;
}

/* ---------- camera ---------- */
.cam{padding:14px}
.cam-head{display:flex;align-items:center;justify-content:space-between;padding:2px 4px 12px}
.cam-title{font-size:.95rem;font-weight:600}
.live-pill{
  display:inline-flex;align-items:center;gap:7px;
  font-size:.72rem;font-weight:700;letter-spacing:.06em;
  background:rgba(255,92,114,.13);color:#ff8797;
  border:1px solid rgba(255,92,114,.3);
  border-radius:999px;padding:4px 11px;
}
.dot{width:7px;height:7px;border-radius:50%;background:var(--live);animation:pulse 1.9s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}
.video-shell{border-radius:var(--radius);overflow:hidden;background:#0c0910;aspect-ratio:16/10}
.video-js{width:100%!important;height:100%!important}

/* ---------- the treat button (the one loud thing) ---------- */
.feeder{margin-top:16px}
.treat-btn{
  position:relative;width:100%;overflow:hidden;
  border:none;border-radius:18px;padding:19px 22px;
  background:linear-gradient(135deg,#ffb454,#ff9463);
  color:var(--accent-ink);
  font-family:"Bricolage Grotesque",sans-serif;
  font-size:1.14rem;font-weight:800;letter-spacing:-.01em;
  cursor:pointer;
  box-shadow:0 10px 26px rgba(255,148,99,.2);
  transition:transform .12s ease,box-shadow .2s ease,filter .2s ease;
}
.treat-btn:hover:not(:disabled){transform:translateY(-2px);box-shadow:0 16px 34px rgba(255,148,99,.28)}
.treat-btn:active:not(:disabled){transform:translateY(1px)}
.treat-btn:disabled{cursor:not-allowed;filter:saturate(.35) brightness(.75);box-shadow:none}
.treat-btn .label{position:relative;z-index:2;display:block}
.treat-btn .sub{position:relative;z-index:2;display:block;font-family:Inter,sans-serif;font-size:.78rem;font-weight:600;opacity:.72;margin-top:3px}
.treat-fill{
  position:absolute;inset:0;z-index:1;
  background:rgba(20,16,25,.45);
  transform-origin:left;transform:scaleX(0);
}
.treat-fill.running{transition:transform linear}

.feeder-status{
  margin:12px 2px 2px;font-size:.84rem;color:var(--muted);
  display:flex;align-items:center;gap:8px;min-height:20px;
}
.feeder-status .sdot{width:7px;height:7px;border-radius:50%;background:var(--ok);flex:none}
.feeder-status.warn .sdot{background:var(--accent)}
.feeder-status.err .sdot{background:var(--live)}

/* ---------- composer ---------- */
.feed-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin:0 4px 14px}
.feed-head h2{font-size:1.3rem}
.feed-note{font-size:.8rem;color:var(--muted)}

.composer textarea{
  width:100%;min-height:86px;resize:vertical;
  background:var(--surface-2);border:1px solid var(--line);
  border-radius:var(--radius);padding:13px 15px;
  font-size:.95rem;line-height:1.5;
}
.composer textarea::placeholder{color:#7d7291}
.composer textarea:focus{border-color:#50415f;outline:none}
.composer-row{display:flex;align-items:center;gap:10px;margin-top:11px;flex-wrap:wrap}
.file-btn{position:relative;overflow:hidden;display:inline-flex}
.file-btn input[type=file]{position:absolute;inset:0;opacity:0;cursor:pointer;font-size:120px}
.file-name{font-size:.78rem;color:var(--muted);max-width:170px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.composer-row .spacer{margin-left:auto}

.locked{
  display:flex;align-items:center;justify-content:space-between;gap:12px;
  flex-wrap:wrap;font-size:.9rem;color:var(--muted);
}

/* ---------- posts ---------- */
.feed{margin-top:20px;display:flex;flex-direction:column;gap:16px}
.post{
  background:var(--surface);border:1px solid var(--line);
  border-radius:var(--radius-lg);padding:18px;
}
.post-top{display:flex;align-items:center;gap:11px;margin-bottom:12px}
.avatar{
  width:38px;height:38px;border-radius:13px;flex:none;
  display:grid;place-items:center;font-size:17px;
  background:var(--surface-2);border:1px solid var(--line);
}
.post-who{min-width:0}
.post-author{font-weight:600;font-size:.94rem}
.post-time{font-size:.76rem;color:var(--muted)}

.meows{
  font-family:"Bricolage Grotesque",sans-serif;
  font-size:1.16rem;font-weight:500;line-height:1.45;
  letter-spacing:.01em;word-break:break-word;
  margin:2px 0 12px;
}
.human{
  border-left:2px solid var(--line);
  padding:2px 0 2px 12px;margin:-4px 0 12px;
  color:var(--muted);font-size:.9rem;white-space:pre-wrap;word-break:break-word;
}
.post-img{width:100%;max-height:420px;object-fit:cover;border-radius:var(--radius);margin-bottom:12px;display:block;background:var(--surface-2)}

.post-bar{display:flex;align-items:center;gap:6px;border-top:1px solid var(--line);padding-top:10px}
.act{
  background:none;border:none;cursor:pointer;
  color:var(--muted);font-size:.85rem;font-weight:600;
  padding:6px 11px;border-radius:999px;
  display:inline-flex;align-items:center;gap:6px;
  transition:background .15s ease,color .15s ease;
}
.act:hover{background:var(--surface-2);color:var(--text)}
.act.on{color:var(--live)}
.act.subtle{margin-left:auto;font-weight:500;font-size:.8rem}

.comments{margin-top:12px;display:flex;flex-direction:column;gap:9px}
.comment{display:flex;gap:9px;align-items:flex-start}
.c-avatar{width:26px;height:26px;border-radius:9px;flex:none;display:grid;place-items:center;font-size:12px;background:var(--surface-2);border:1px solid var(--line)}
.c-body{background:var(--surface-2);border-radius:12px;padding:7px 12px;min-width:0}
.c-name{font-size:.78rem;font-weight:600;color:var(--muted)}
.c-text{font-family:"Bricolage Grotesque",sans-serif;font-size:.95rem;word-break:break-word}
.c-form{display:flex;gap:8px;margin-top:4px}
.c-form input{
  flex:1;min-width:0;background:var(--surface-2);border:1px solid var(--line);
  border-radius:999px;padding:8px 15px;font-size:.87rem;
}
.c-form input:focus{border-color:#50415f;outline:none}

.empty{
  border:1px dashed var(--line);border-radius:var(--radius-lg);
  padding:44px 24px;text-align:center;color:var(--muted);
}
.empty .big{font-size:2rem;display:block;margin-bottom:8px}

/* ---------- modals ---------- */
.overlay{
  position:fixed;inset:0;z-index:100;display:none;
  background:rgba(10,7,14,.72);backdrop-filter:blur(4px);
  padding:20px;overflow:auto;
}
.overlay.open{display:grid;place-items:center}
.modal{
  width:100%;max-width:400px;background:var(--surface);
  border:1px solid var(--line);border-radius:var(--radius-lg);
  padding:26px;position:relative;
}
.modal h3{font-size:1.25rem;margin-bottom:4px}
.modal p.hint{color:var(--muted);font-size:.86rem;margin:0 0 18px}
.modal form{display:flex;flex-direction:column;gap:10px}
.modal input{
  background:var(--surface-2);border:1px solid var(--line);
  border-radius:var(--radius-sm);padding:11px 14px;font-size:.92rem;
}
.modal input:focus{border-color:#50415f;outline:none}
.modal .btn-primary{margin-top:6px;padding:11px}
.x{
  position:absolute;top:14px;right:14px;background:none;border:none;
  color:var(--muted);font-size:1.4rem;line-height:1;cursor:pointer;padding:4px 8px;border-radius:8px;
}
.x:hover{color:var(--text);background:var(--surface-2)}

/* ---------- toasts ---------- */
#toasts{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);z-index:200;display:flex;flex-direction:column;gap:9px;align-items:center;width:calc(100% - 32px);max-width:400px}
.toast{
  background:var(--surface-2);border:1px solid var(--line);
  border-radius:14px;padding:11px 17px;font-size:.88rem;font-weight:500;
  box-shadow:0 12px 30px rgba(0,0,0,.4);
  display:flex;gap:9px;align-items:center;
}
.toast.good{border-color:rgba(102,217,160,.4)}
.toast.bad{border-color:rgba(255,92,114,.4)}

@media (prefers-reduced-motion:reduce){
  *{animation:none!important;transition:none!important}
}
</style>
</head>
<body>

<header class="topbar">
  <div class="topbar-inner">
    <div class="brand">
      <span class="brand-mark">🐈‍⬛</span>
      <span>
        <span class="brand-name">Feed a Goose</span>
        <span class="brand-sub" data-i18n="tagline"></span>
      </span>
    </div>

    <div class="lang-wrap">
      <select class="lang" id="langSelect" aria-label="Language">
        <option value="en">English</option>
        <option value="fr">Français</option>
        <option value="it">Italiano</option>
        <option value="ru">Русский</option>
        <option value="zh">中文</option>
        <option value="ja">日本語</option>
      </select>
      <svg width="11" height="7" viewBox="0 0 11 7" fill="none"><path d="M1 1l4.5 4.5L10 1" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
    </div>

    <span id="zoneOut">
      <button class="btn btn-ghost" onclick="openModal('login')" data-i18n="signIn"></button>
      <button class="btn btn-primary" onclick="openModal('register')" data-i18n="signUp"></button>
    </span>

    <span id="zoneIn" style="display:none;align-items:center;gap:10px">
      <span class="badge" id="userBadge"></span>
      <button class="btn btn-ghost" onclick="logout()" data-i18n="logOut"></button>
    </span>
  </div>
</header>

<main class="shell">
  <div class="grid">

    <!-- LEFT: camera + feeder -->
    <div class="col-left">
      <section class="panel cam">
        <div class="cam-head">
          <span class="cam-title" data-i18n="camTitle"></span>
          <span class="live-pill"><span class="dot"></span>LIVE</span>
        </div>
        <div class="video-shell">
          <video id="camera" class="video-js vjs-default-skin vjs-big-play-centered" controls preload="auto" data-setup="{}">
            <source src="https://test-streams.mux.dev/x36xhzz/x36xhzz.m3u8" type="application/x-mpegURL">
          </video>
        </div>

        <div class="feeder">
          <button class="treat-btn" id="treatBtn" onclick="dispense()">
            <span class="treat-fill" id="treatFill"></span>
            <span class="label" data-i18n="dispense"></span>
            <span class="sub" id="treatSub"></span>
          </button>
          <p class="feeder-status" id="feederStatus"><span class="sdot"></span><span data-i18n="ready"></span></p>
        </div>
      </section>
    </div>

    <!-- RIGHT: the wall -->
    <div>
      <div class="feed-head">
        <h2 data-i18n="wallTitle"></h2>
        <span class="feed-note" id="feedNote"></span>
      </div>

      <section class="panel composer" id="composer"></section>

      <div class="feed" id="feed">
        <div class="empty"><span class="big">🐾</span><span data-i18n="loading"></span></div>
      </div>
    </div>

  </div>
</main>

<!-- MODALS -->
<div class="overlay" id="modal-login" onclick="if(event.target===this)closeModals()">
  <div class="modal">
    <button class="x" onclick="closeModals()" aria-label="Close">&times;</button>
    <h3 data-i18n="signIn"></h3>
    <p class="hint" data-i18n="loginHint"></p>
    <form onsubmit="auth(event,'/login')">
      <input name="username" data-ph="username" required autocomplete="username">
      <input type="password" name="password" data-ph="password" required autocomplete="current-password">
      <button class="btn btn-primary" type="submit" data-i18n="signIn"></button>
    </form>
  </div>
</div>

<div class="overlay" id="modal-register" onclick="if(event.target===this)closeModals()">
  <div class="modal">
    <button class="x" onclick="closeModals()" aria-label="Close">&times;</button>
    <h3 data-i18n="signUp"></h3>
    <p class="hint" data-i18n="registerHint"></p>
    <form onsubmit="auth(event,'/register')">
      <input name="username" data-ph="petName" required autocomplete="username">
      <input type="email" name="email" data-ph="email" required autocomplete="email">
      <input type="password" id="regPass" name="password" data-ph="password" required autocomplete="new-password">
      <input type="password" id="regConfirm" name="confirmPassword" data-ph="confirm" required autocomplete="new-password">
      <button class="btn btn-primary" type="submit" data-i18n="signUp"></button>
    </form>
  </div>
</div>

<div id="toasts"></div>

/* ============================================================
   2. THE MEOW ENGINE
   Every post is stored as the human wrote it. It is only ever
   *displayed* as meows, re-rendered in the selected language.
   The same post always produces the same meows (seeded hash),
   so it doesn't reshuffle on every render.
   ============================================================ */
const MEOWS = {
  en:["meow","mew","mrow","meoww","mrrp","purr"],
  fr:["miaou","miaw","mrou","miaou","miaaou"],
  it:["miao","miau","mia","miaoo"],
  ru:["мяу","мяв","мур","мяуу"],
  zh:["喵","喵呜","喵喵","咪"],
  ja:["にゃー","にゃん","にゃあ","ニャー"]
};
const LOCALES = {en:"en-US",fr:"fr-FR",it:"it-IT",ru:"ru-RU",zh:"zh-CN",ja:"ja-JP"};

function hash(str){
  let h = 2166136261;
  for(let i=0;i<str.length;i++){ h ^= str.charCodeAt(i); h = Math.imul(h,16777619); }
  return h >>> 0;
}

function meowify(text, lang, seed){
  const bank = MEOWS[lang] || MEOWS.en;
  const raw  = (text || "").trim();
  if(!raw) return bank[0];

  // one meow per word, capped so nobody can write a novel
  const words = raw.split(/\s+/).filter(Boolean).slice(0, 45);
  const out = words.map((w,i) => bank[ hash(seed + "|" + i + "|" + w.length) % bank.length ]);

  let line = out.join(" ");

  // keep the emotional punctuation the human ended on
  const tail = raw.match(/[!?！？…~]+$/);
  line += tail ? tail[0] : (lang === "zh" || lang === "ja" ? "" : ".");

  // capitalise for latin/cyrillic scripts
  if(!["zh","ja"].includes(lang)) line = line.charAt(0).toUpperCase() + line.slice(1);
  return line;
}

/* ============================================================
   3. STATE
   ============================================================ */
const State = {
  lang: localStorage.getItem("goose_lang") || "en",
  me: null,
  posts: [],
  human: new Set(),      // ids of posts currently shown in human
  cooldownUntil: 0
};
const t = () => I18N[State.lang];

/* ============================================================
   4. HELPERS
   ============================================================ */
function esc(s){
  return String(s ?? "").replace(/[&<>'"]/g, c => (
    {"&":"&amp;","<":"&lt;",">":"&gt;","'":"&#39;",'"':"&quot;"}[c]
  ));
}

function toast(msg, kind=""){
  const el = document.createElement("div");
  el.className = "toast " + kind;
  el.textContent = msg;
  document.getElementById("toasts").appendChild(el);
  setTimeout(() => el.remove(), 3600);
}

function when(ts){
  const d = new Date(ts.includes("Z") || ts.includes("T") ? ts : ts.replace(" ", "T") + "Z");
  if(isNaN(d)) return "";
  return new Intl.DateTimeFormat(LOCALES[State.lang], {
    day:"numeric", month:"short", hour:"2-digit", minute:"2-digit"
  }).format(d);
}

function pawFor(name){
  const paws = ["🐈","🐈‍⬛","🐱","🐾","😼","🙀","😻","🐕","🐹","🦜"];
  return paws[hash(name || "anon") % paws.length];
}

/* ============================================================
   5. RENDER
   ============================================================ */
function applyLanguage(){
  document.documentElement.lang = State.lang;
  document.querySelectorAll("[data-i18n]").forEach(el => {
    const v = t()[el.dataset.i18n];
    if(typeof v === "string") el.textContent = v;
  });
  document.querySelectorAll("[data-ph]").forEach(el => {
    el.placeholder = t()[el.dataset.ph] || "";
  });
  document.getElementById("treatSub").textContent = t().dispenseSub;
  renderComposer();
  renderFeed();
  renderSession();
}

function renderComposer(){
  const box = document.getElementById("composer");
  if(!State.me){
    box.innerHTML = `
      <div class="locked">
        <span>${esc(t().lockedMsg)}</span>
        <button class="btn btn-primary btn-sm" onclick="openModal('register')">${esc(t().signUp)}</button>
      </div>`;
    return;
  }
  box.innerHTML = `
    <form id="postForm" onsubmit="submitPost(event)">
      <textarea name="content" placeholder="${esc(t().composerPh)}" required></textarea>
      <div class="composer-row">
        <span class="file-btn">
          <button type="button" class="btn btn-ghost btn-sm">📷 ${esc(t().addPhoto)}</button>
          <input type="file" name="image" accept="image/*" onchange="document.getElementById('fileName').textContent = this.files[0] ? this.files[0].name : ''">
        </span>
        <span class="file-name" id="fileName"></span>
        <span class="spacer"></span>
        <button type="submit" class="btn btn-primary btn-sm">${esc(t().post)}</button>
      </div>
    </form>`;
}

function renderFeed(){
  const feed = document.getElementById("feed");
  const note = document.getElementById("feedNote");
  note.textContent = t().feedNote(State.posts.length);

  if(!State.posts.length){
    feed.innerHTML = `<div class="empty"><span class="big">🐾</span>
      <strong>${esc(t().emptyTitle)}</strong><br>${esc(t().emptySub)}</div>`;
    return;
  }

  feed.innerHTML = State.posts.map(p => {
    const showHuman = State.human.has(p.id);
    const body = showHuman
      ? `<div class="meows">${esc(meowify(p.content, State.lang, "post" + p.id))}</div>
         <div class="human">${esc(p.content)}</div>`
      : `<div class="meows">${esc(meowify(p.content, State.lang, "post" + p.id))}</div>`;

    const comments = (p.comments || []).map(c => `
      <div class="comment">
        <span class="c-avatar">${pawFor(c.username)}</span>
        <div class="c-body">
          <div class="c-name">${esc(c.username)}</div>
          <div class="c-text">${esc(meowify(c.content, State.lang, "c" + c.id))}</div>
        </div>
      </div>`).join("");

    return `
      <article class="post">
        <div class="post-top">
          <span class="avatar">${pawFor(p.username)}</span>
          <div class="post-who">
            <div class="post-author">${esc(p.username)}</div>
            <div class="post-time">${esc(when(p.timestamp))}</div>
          </div>
        </div>
        ${body}
        ${p.image_url ? `<img class="post-img" src="${esc(p.image_url)}" alt="" loading="lazy">` : ""}
        <div class="post-bar">
          <button class="act ${p.user_has_liked ? "on" : ""}" onclick="like(${p.id})">
            ${p.user_has_liked ? "❤️" : "🤍"} ${esc(t().like)} ${p.total_likes ? "· " + p.total_likes : ""}
          </button>
          <button class="act subtle" onclick="toggleHuman(${p.id})">
            ${esc(showHuman ? t().hideHuman : t().showHuman)}
          </button>
        </div>
        <div class="comments">
          ${comments}
          ${State.me ? `
          <form class="c-form" onsubmit="submitComment(event, ${p.id})">
            <input name="content" placeholder="${esc(t().commentPh)}" required>
            <button type="submit" class="btn btn-ghost btn-sm">${esc(t().send)}</button>
          </form>` : ""}
        </div>
      </article>`;
  }).join("");
}

function renderSession(){
  const out = document.getElementById("zoneOut");
  const inn = document.getElementById("zoneIn");
  if(State.me && State.me.loggedIn){
    out.style.display = "none";
    inn.style.display = "inline-flex";
    document.getElementById("userBadge").innerHTML =
      `${pawFor(State.me.username)} ${esc(State.me.username)} <span class="fish">🐟 ${State.me.tokens}</span>`;
  }else{
    out.style.display = "inline-flex";
    inn.style.display = "none";
  }
}

function setStatus(text, kind=""){
  const el = document.getElementById("feederStatus");
  el.className = "feeder-status " + kind;
  el.innerHTML = `<span class="sdot"></span><span></span>`;
  el.lastElementChild.textContent = text;
}

function toggleHuman(id){
  State.human.has(id) ? State.human.delete(id) : State.human.add(id);
  renderFeed();
}

/* ============================================================
   6. SERVER CALLS
   ============================================================ */
async function loadWall(){
  try{
    const r = await fetch("/api/posts");
    const d = await r.json();
    State.posts = d.status === "Success" ? d.posts : [];
  }catch(e){
    State.posts = [];
  }
  renderFeed();
}

async function checkSession(){
  try{
    const r = await fetch("/api/me");
    State.me = await r.json();
  }catch(e){ State.me = null; }
  renderSession();
  renderComposer();
}

async function auth(event, endpoint){
  event.preventDefault();
  const data = Object.fromEntries(new FormData(event.target));

  if(endpoint === "/register" &&
     document.getElementById("regPass").value !== document.getElementById("regConfirm").value){
    return toast(t().mismatch, "bad");
  }

  try{
    const r = await fetch(endpoint, {
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify(data)
    });
    const d = await r.json();
    toast(d.message || "…", r.ok ? "good" : "bad");
    if(r.ok){
      event.target.reset();
      closeModals();
      await checkSession();
      loadWall();
    }
  }catch(e){ toast(t().netErr, "bad"); }
}

async function logout(){
  try{
    await fetch("/logout", {method:"POST"});
    State.me = null;
    State.human.clear();
    renderSession(); renderComposer(); loadWall();
  }catch(e){ toast(t().netErr, "bad"); }
}

async function submitPost(event){
  event.preventDefault();
  const form = event.target;
  const btn = form.querySelector("button[type=submit]");
  btn.disabled = true;
  try{
    const r = await fetch("/api/posts", {method:"POST", body:new FormData(form)});
    const d = await r.json();
    if(!r.ok) throw new Error(d.message);
    form.reset();
    loadWall();
  }catch(e){
    toast(e.message || t().netErr, "bad");
  }finally{ btn.disabled = false; }
}

async function like(postId){
  if(!State.me || !State.me.loggedIn) return toast(t().needLogin, "bad");
  try{
    const r = await fetch(`/api/posts/${postId}/like`, {method:"POST"});
    if(r.status === 401) return toast(t().needLogin, "bad");
    loadWall();
  }catch(e){ toast(t().netErr, "bad"); }
}

async function submitComment(event, postId){
  event.preventDefault();
  const form = event.target;
  const input = form.querySelector("input[name=content]");
  try{
    const r = await fetch(`/api/posts/${postId}/comments`, {
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({content: input.value})
    });
    const d = await r.json();
    if(!r.ok) throw new Error(d.message);
    form.reset();
    loadWall();
  }catch(e){ toast(e.message || t().netErr, "bad"); }
}

/* ---------- the treat button ---------- */
const MOTOR_MS = 3000;     // matches MOTOR_DELAY in server.js
const COOLDOWN_MS = 10000; // matches SPAM_COOLDOWN in server.js

function fillBar(ms){
  const fill = document.getElementById("treatFill");
  fill.classList.remove("running");
  fill.style.transitionDuration = "0ms";
  fill.style.transform = "scaleX(1)";
  requestAnimationFrame(() => {
    fill.classList.add("running");
    fill.style.transitionDuration = ms + "ms";
    fill.style.transform = "scaleX(0)";
  });
}

function startCooldown(ms){
  const btn = document.getElementById("treatBtn");
  const sub = document.getElementById("treatSub");
  State.cooldownUntil = Date.now() + ms;
  btn.disabled = true;
  fillBar(ms);

  const tick = () => {
    const left = State.cooldownUntil - Date.now();
    if(left <= 0){
      btn.disabled = false;
      sub.textContent = t().dispenseSub;
      setStatus(t().ready);
      return;
    }
    sub.textContent = t().waitSec(Math.ceil(left / 1000));
    setTimeout(tick, 250);
  };
  tick();
}

async function dispense(){
  if(!State.me || !State.me.loggedIn){
    openModal("login");
    return toast(t().needLogin, "bad");
  }
  const btn = document.getElementById("treatBtn");
  btn.disabled = true;
  document.getElementById("treatSub").textContent = t().dispensing;
  setStatus(t().sending, "warn");
  fillBar(MOTOR_MS);

  try{
    const r = await fetch("/dispense");
    const d = await r.json();

    if(d.status === "Success"){
      setStatus(t().dropped);
      toast(t().dropped, "good");
      if(State.me && typeof d.remainingTokens === "number"){
        State.me.tokens = d.remainingTokens;
        renderSession();
      }
      startCooldown(COOLDOWN_MS);
    }else{
      setStatus(d.message, "err");
      toast(d.message, "bad");
      btn.disabled = false;
      document.getElementById("treatSub").textContent = t().dispenseSub;
      fillBar(0);
      checkSession();
    }
  }catch(e){
    setStatus(t().offline, "err");
    toast(t().offline, "bad");
    btn.disabled = false;
    document.getElementById("treatSub").textContent = t().dispenseSub;
  }
}

/* ---------- modals ---------- */
function openModal(which){ document.getElementById("modal-" + which).classList.add("open"); }
function closeModals(){ document.querySelectorAll(".overlay").forEach(o => o.classList.remove("open")); }
document.addEventListener("keydown", e => { if(e.key === "Escape") closeModals(); });

/* ============================================================
   7. BOOT
   ============================================================ */
document.getElementById("langSelect").addEventListener("change", e => {
  State.lang = e.target.value;
  localStorage.setItem("goose_lang", State.lang);
  applyLanguage();
});

window.addEventListener("DOMContentLoaded", async () => {
  document.getElementById("langSelect").value = State.lang;
  applyLanguage();
  await checkSession();
  loadWall();
  setInterval(loadWall, 30000);   // gentle auto-refresh of the wall
});
</script>
