<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Feed a Goose</title>

<link href="https://vjs.zencdn.net/8.10.0/video-js.css" rel="stylesheet">
<script src="https://vjs.zencdn.net/8.10.0/video.min.js"></script>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
:root{
  --ink:#141019;
  --surface:#1d1825;
  --surface-2:#272031;
  --line:#352c44;
  --text:#f1ecf6;
  --muted:#a196b3;
  --accent:#ffb454;
  --accent-ink:#2a1a02;
  --live:#ff5c72;
  --ok:#66d9a0;
  --radius-lg:22px;
  --radius:14px;
  --radius-sm:10px;
  --shell:1180px;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;
  background:
    radial-gradient(1100px 600px at 12% -8%, #2b2038 0%, transparent 60%),
    radial-gradient(900px 520px at 92% 0%, #1f2a33 0%, transparent 55%),
    var(--ink);
  background-attachment:fixed;
  color:var(--text);
  font-family:Inter,"Noto Sans SC","Noto Sans JP","PingFang SC","Hiragino Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased;
}
h1,h2,h3{font-family:"Bricolage Grotesque",Inter,system-ui,sans-serif;font-weight:700;letter-spacing:-0.02em;margin:0}
button,input,textarea,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:6px}

/* ---------- top bar ---------- */
.topbar{position:sticky;top:0;z-index:60;backdrop-filter:blur(14px);background:rgba(20,16,25,.78);border-bottom:1px solid var(--line)}
.topbar-inner{max-width:var(--shell);margin:0 auto;padding:12px 20px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;margin-right:auto;min-width:0}
.brand-mark{width:36px;height:36px;flex:none;border-radius:12px;background:linear-gradient(150deg,var(--accent),#ff8a6b);display:grid;place-items:center;font-size:19px;box-shadow:0 6px 18px rgba(255,180,84,.22)}
.brand-name{font-family:"Bricolage Grotesque",sans-serif;font-weight:800;font-size:1.12rem;letter-spacing:-.03em}
.brand-sub{display:block;font-size:.74rem;color:var(--muted);font-weight:500;letter-spacing:0}
.nav-icons{display:flex;align-items:center;gap:8px}
.icon-btn{
  position:relative;display:grid;place-items:center;
  width:36px;height:36px;border-radius:999px;
  background:var(--surface-2);border:1px solid var(--line);color:var(--text);
  text-decoration:none;transition:background .15s ease,border-color .15s ease;
}
.icon-btn:hover{background:#32293e;border-color:#4a3d5d}
.icon-tip{
  position:absolute;top:calc(100% + 8px);left:50%;transform:translateX(-50%) translateY(-4px);
  background:var(--surface-2);border:1px solid var(--line);color:var(--text);
  font-size:.74rem;font-weight:600;white-space:nowrap;
  padding:5px 10px;border-radius:8px;
  opacity:0;pointer-events:none;transition:opacity .14s ease,transform .14s ease;
}
.icon-btn:hover .icon-tip{opacity:1;transform:translateX(-50%) translateY(0)}
.lang-wrap{position:relative;display:flex;align-items:center}
.lang-wrap svg{position:absolute;right:11px;pointer-events:none;opacity:.6}
select.lang{appearance:none;-webkit-appearance:none;background:var(--surface-2);border:1px solid var(--line);border-radius:999px;padding:8px 30px 8px 14px;font-size:.86rem;font-weight:600;cursor:pointer}
select.lang:hover{border-color:#4a3d5d}

.btn{border:1px solid transparent;border-radius:999px;padding:9px 18px;font-size:.88rem;font-weight:600;background:var(--surface-2);color:var(--text);cursor:pointer;transition:transform .12s ease,background .15s ease,border-color .15s ease}
.btn:hover{background:#32293e}
.btn:active{transform:translateY(1px)}
.btn-ghost{background:transparent;border-color:var(--line)}
.btn-ghost:hover{background:var(--surface-2)}
.btn-primary{background:var(--accent);color:var(--accent-ink)}
.btn-primary:hover{background:#ffc470}
.btn-sm{padding:6px 13px;font-size:.82rem}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none}
.badge{display:inline-flex;align-items:center;gap:8px;background:var(--surface-2);border:1px solid var(--line);border-radius:999px;padding:4px 14px 4px 5px;font-size:.84rem;font-weight:600}
.badge .fish{color:var(--accent)}
.badge .mini{width:26px;height:26px;border-radius:50%;overflow:hidden;flex:none;background:var(--ink)}
.mod-tag{background:rgba(255,180,84,.14);color:var(--accent);border:1px solid rgba(255,180,84,.3);border-radius:999px;padding:1px 8px;font-size:.66rem;font-weight:700;letter-spacing:.05em}

/* ---------- layout ---------- */
.shell{max-width:var(--shell);margin:0 auto;padding:26px 20px 80px}
.grid{display:grid;grid-template-columns:1fr;gap:22px}
@media(min-width:960px){.grid{grid-template-columns:minmax(0,420px) minmax(0,1fr);align-items:start}.col-left{position:sticky;top:78px}}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-lg);padding:18px}

/* ---------- camera ---------- */
.cam{padding:14px}
.cam-head{display:flex;align-items:center;justify-content:space-between;padding:2px 4px 12px}
.cam-title{font-size:.95rem;font-weight:600}
.live-pill{display:inline-flex;align-items:center;gap:7px;font-size:.72rem;font-weight:700;letter-spacing:.06em;background:rgba(255,92,114,.13);color:#ff8797;border:1px solid rgba(255,92,114,.3);border-radius:999px;padding:4px 11px}
.dot{width:7px;height:7px;border-radius:50%;background:var(--live);animation:pulse 1.9s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}
.video-shell{border-radius:var(--radius);overflow:hidden;background:#0c0910;aspect-ratio:16/10}
.video-js{width:100%!important;height:100%!important}

/* ---------- treat button ---------- */
.feeder{margin-top:16px}
.treat-btn{position:relative;width:100%;overflow:hidden;border:none;border-radius:18px;padding:19px 22px;background:linear-gradient(135deg,#ffb454,#ff9463);color:var(--accent-ink);font-family:"Bricolage Grotesque",sans-serif;font-size:1.14rem;font-weight:800;letter-spacing:-.01em;cursor:pointer;box-shadow:0 10px 26px rgba(255,148,99,.2);transition:transform .12s ease,box-shadow .2s ease,filter .2s ease}
.treat-btn:hover:not(:disabled){transform:translateY(-2px);box-shadow:0 16px 34px rgba(255,148,99,.28)}
.treat-btn:active:not(:disabled){transform:translateY(1px)}
.treat-btn:disabled{cursor:not-allowed;filter:saturate(.35) brightness(.75);box-shadow:none}
.treat-btn .label{position:relative;z-index:2;display:block}
.treat-btn .sub{position:relative;z-index:2;display:block;font-family:Inter,sans-serif;font-size:.78rem;font-weight:600;opacity:.72;margin-top:3px}
.treat-fill{position:absolute;inset:0;z-index:1;background:rgba(20,16,25,.45);transform-origin:left;transform:scaleX(0)}
.treat-fill.running{transition:transform linear}
.feeder-status{margin:12px 2px 2px;font-size:.84rem;color:var(--muted);display:flex;align-items:center;gap:8px;min-height:20px}
.feeder-status .sdot{width:7px;height:7px;border-radius:50%;background:var(--ok);flex:none}
.feeder-status.warn .sdot{background:var(--accent)}
.feeder-status.err .sdot{background:var(--live)}

/* ---------- treat line ---------- */
.queue{margin-top:14px;border-top:1px solid var(--line);padding-top:13px}
.queue-head{display:flex;align-items:center;justify-content:space-between;padding:0 2px 9px;font-size:.78rem;font-weight:600;color:var(--muted)}
.queue-count{background:var(--surface-2);border:1px solid var(--line);border-radius:999px;padding:2px 9px;font-size:.72rem}
.queue-list{display:flex;flex-direction:column;gap:2px;max-height:176px;overflow-y:auto;overscroll-behavior:contain;padding-right:4px}
.queue-list::-webkit-scrollbar{width:6px}
.queue-list::-webkit-scrollbar-thumb{background:#3d3350;border-radius:99px}
.queue-list::-webkit-scrollbar-track{background:transparent}
.q-row{display:flex;align-items:baseline;gap:7px;font-size:.87rem;line-height:1.35;padding:5px 8px;border-radius:9px;animation:slideIn .28s ease both}
.q-row.serving{background:rgba(255,180,84,.09);box-shadow:inset 0 0 0 1px rgba(255,180,84,.2)}
.q-row .who{font-weight:700;white-space:nowrap}
.q-row .said{color:var(--muted);min-width:0}
.q-row .pos{margin-left:auto;font-size:.7rem;color:#6f6584;font-variant-numeric:tabular-nums;padding-left:6px}
.q-row .motor{margin-left:auto;font-size:.8rem;animation:shake .9s infinite}
@keyframes slideIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@keyframes shake{0%,100%{transform:rotate(-8deg)}50%{transform:rotate(8deg)}}
.queue-empty{font-size:.83rem;color:#6f6584;padding:8px 8px 4px}

/* ---------- composer ---------- */
.feed-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin:0 4px 14px}
.feed-head h2{font-size:1.3rem}
.feed-note{font-size:.8rem;color:var(--muted)}
.composer textarea{width:100%;min-height:86px;resize:vertical;background:var(--surface-2);border:1px solid var(--line);border-radius:var(--radius);padding:13px 15px;font-size:.95rem;line-height:1.5}
.composer textarea::placeholder{color:#7d7291}
.composer textarea:focus{border-color:#50415f;outline:none}
.composer-row{display:flex;align-items:center;gap:10px;margin-top:11px;flex-wrap:wrap}
.file-btn{position:relative;overflow:hidden;display:inline-flex}
.file-btn input[type=file]{position:absolute;inset:0;opacity:0;cursor:pointer;font-size:120px}
.file-name{font-size:.78rem;color:var(--muted);max-width:170px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.composer-row .spacer{margin-left:auto}
.locked{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;font-size:.9rem;color:var(--muted)}

/* ---------- posts ---------- */
.feed{margin-top:20px;display:flex;flex-direction:column;gap:16px}
.post{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-lg);padding:18px}
.post.leaving{opacity:0;transform:scale(.97);transition:opacity .22s ease,transform .22s ease}
.post-top{display:flex;align-items:center;gap:11px;margin-bottom:12px}
.avatar{width:40px;height:40px;border-radius:14px;flex:none;overflow:hidden;background:var(--surface-2);border:1px solid var(--line)}
.avatar svg,.c-avatar svg,.mini svg,.big-face svg{display:block;width:100%;height:100%}
.post-who{min-width:0}
.post-author{font-weight:600;font-size:.94rem;cursor:help;border-bottom:1px dotted transparent}
.post-author:hover{border-bottom-color:var(--muted)}
.post-time{font-size:.76rem;color:var(--muted)}
.meows{font-family:"Bricolage Grotesque",sans-serif;font-size:1.16rem;font-weight:500;line-height:1.45;letter-spacing:.01em;word-break:break-word;margin:2px 0 12px}
.human{border-left:2px solid var(--line);padding:2px 0 2px 12px;margin:-4px 0 12px;color:var(--muted);font-size:.9rem;white-space:pre-wrap;word-break:break-word}
.post-img{width:100%;max-height:420px;object-fit:cover;border-radius:var(--radius);margin-bottom:12px;display:block;background:var(--surface-2)}
.post-bar{display:flex;align-items:center;gap:6px;border-top:1px solid var(--line);padding-top:10px;flex-wrap:wrap}
.act{background:none;border:none;cursor:pointer;color:var(--muted);font-size:.85rem;font-weight:600;padding:6px 11px;border-radius:999px;display:inline-flex;align-items:center;gap:6px;transition:background .15s ease,color .15s ease}
.act:hover{background:var(--surface-2);color:var(--text)}
.act.on{color:var(--live)}
.act.subtle{margin-left:auto;font-weight:500;font-size:.8rem}
.act.danger:hover{background:rgba(255,92,114,.12);color:#ff8797}
.comments{margin-top:12px;display:flex;flex-direction:column;gap:9px}
.comment{display:flex;gap:9px;align-items:flex-start}
.c-avatar{width:28px;height:28px;border-radius:10px;flex:none;overflow:hidden;background:var(--surface-2);border:1px solid var(--line)}
.c-body{background:var(--surface-2);border-radius:12px;padding:7px 12px;min-width:0;position:relative}
.c-name{font-size:.78rem;font-weight:600;color:var(--muted);cursor:help}
.c-text{font-family:"Bricolage Grotesque",sans-serif;font-size:.95rem;word-break:break-word}
.c-del{background:none;border:none;color:#6f6584;cursor:pointer;font-size:.76rem;padding:4px 6px;border-radius:7px;align-self:center}
.c-del:hover{color:#ff8797;background:rgba(255,92,114,.1)}
.c-form{display:flex;gap:8px;margin-top:4px}
.c-form input{flex:1;min-width:0;background:var(--surface-2);border:1px solid var(--line);border-radius:999px;padding:8px 15px;font-size:.87rem}
.c-form input:focus{border-color:#50415f;outline:none}
.empty{border:1px dashed var(--line);border-radius:var(--radius-lg);padding:44px 24px;text-align:center;color:var(--muted)}
.empty .big{font-size:2rem;display:block;margin-bottom:8px}

/* ---------- hover profile card ---------- */
#profileCard{
  position:fixed;z-index:150;width:250px;pointer-events:none;
  background:var(--surface);border:1px solid var(--line);border-radius:18px;
  padding:15px;box-shadow:0 20px 44px rgba(0,0,0,.5);
  opacity:0;transform:translateY(6px);transition:opacity .16s ease,transform .16s ease;
}
#profileCard.show{opacity:1;transform:none}
.pc-top{display:flex;align-items:center;gap:11px;margin-bottom:12px}
.big-face{width:52px;height:52px;border-radius:16px;overflow:hidden;flex:none;background:var(--surface-2);border:1px solid var(--line)}
.pc-name{font-family:"Bricolage Grotesque",sans-serif;font-weight:700;font-size:1.06rem;line-height:1.2}
.pc-handle{font-size:.76rem;color:var(--muted)}
.pc-rows{display:flex;flex-direction:column;gap:6px}
.pc-row{display:flex;gap:10px;font-size:.83rem;align-items:baseline}
.pc-row .k{color:#6f6584;width:74px;flex:none}
.pc-row .v{color:var(--text);min-width:0;word-break:break-word}
.pc-empty{font-size:.82rem;color:#6f6584}

/* ---------- modals ---------- */
.overlay{position:fixed;inset:0;z-index:100;display:none;background:rgba(10,7,14,.72);backdrop-filter:blur(4px);padding:20px;overflow:auto}
.overlay.open{display:grid;place-items:center}
.modal{width:100%;max-width:440px;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-lg);padding:26px;position:relative}
.modal h3{font-size:1.25rem;margin-bottom:4px}
.modal p.hint{color:var(--muted);font-size:.86rem;margin:0 0 18px}
.modal form{display:flex;flex-direction:column;gap:10px}
.modal input,.modal select{background:var(--surface-2);border:1px solid var(--line);border-radius:var(--radius-sm);padding:11px 14px;font-size:.92rem;width:100%}
.modal select{appearance:none;-webkit-appearance:none;cursor:pointer}
.modal input:focus,.modal select:focus{border-color:#50415f;outline:none}
.modal input[type=date]{color-scheme:dark}
.field-label{font-size:.76rem;color:var(--muted);font-weight:600;margin:4px 0 -4px}
.x{position:absolute;top:14px;right:14px;background:none;border:none;color:var(--muted);font-size:1.4rem;line-height:1;cursor:pointer;padding:4px 8px;border-radius:8px}
.x:hover{color:var(--text);background:var(--surface-2)}
.steps{display:flex;gap:6px;margin-bottom:16px}
.step-pip{height:3px;flex:1;background:var(--surface-2);border-radius:99px}
.step-pip.on{background:var(--accent)}
.wizard-nav{display:flex;gap:10px;margin-top:6px}
.wizard-nav .btn{flex:1;padding:11px}

/* ---------- avatar picker ---------- */
.face-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;max-height:270px;overflow-y:auto;padding:4px;margin-bottom:4px}
@media(max-width:480px){.face-grid{grid-template-columns:repeat(5,1fr)}}
.face-grid::-webkit-scrollbar{width:6px}
.face-grid::-webkit-scrollbar-thumb{background:#3d3350;border-radius:99px}
.face-opt{aspect-ratio:1;border-radius:13px;border:2px solid transparent;background:var(--surface-2);cursor:pointer;padding:2px;overflow:hidden;transition:transform .12s ease,border-color .12s ease}
.face-opt:hover{transform:scale(1.08)}
.face-opt.sel{border-color:var(--accent);background:rgba(255,180,84,.12)}
.face-opt svg{display:block;width:100%;height:100%}
.picked{display:flex;align-items:center;gap:11px;background:var(--surface-2);border-radius:14px;padding:10px 13px;margin-bottom:12px}
.picked .big-face{width:44px;height:44px}
.picked-label{font-size:.82rem;color:var(--muted)}

/* ---------- toasts ---------- */
#toasts{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);z-index:200;display:flex;flex-direction:column;gap:9px;align-items:center;width:calc(100% - 32px);max-width:400px}
.toast{background:var(--surface-2);border:1px solid var(--line);border-radius:14px;padding:11px 17px;font-size:.88rem;font-weight:500;box-shadow:0 12px 30px rgba(0,0,0,.4);display:flex;gap:9px;align-items:center}
.toast.good{border-color:rgba(102,217,160,.4)}
.toast.bad{border-color:rgba(255,92,114,.4)}

/* ---------- cat of the week ---------- */
.cotw{margin-top:22px;position:relative;overflow:hidden;background:
  radial-gradient(120% 140% at 15% 0%, rgba(255,180,84,.12), transparent 55%),
  radial-gradient(120% 140% at 100% 100%, rgba(199,155,255,.1), transparent 55%),
  var(--surface);
}
.cotw-head{display:flex;justify-content:center;margin-bottom:12px;position:relative;z-index:2}
.cotw-title{font-family:"Bricolage Grotesque",sans-serif;font-weight:800;font-size:1.02rem;letter-spacing:-.01em}
.cotw-body{position:relative;z-index:2}

.cotw-empty{text-align:center;color:var(--muted);font-size:.86rem;padding:10px 6px 4px}
.cotw-empty a{color:var(--accent);font-weight:600;text-decoration:none}
.cotw-empty a:hover{text-decoration:underline}

.cotw-card{position:relative}
.cotw-frame{
  position:relative;border-radius:18px;overflow:hidden;
  border:1px solid rgba(255,180,84,.35);
  box-shadow:0 0 0 1px rgba(255,180,84,.08), 0 14px 30px rgba(0,0,0,.35);
}
.cotw-photo{width:100%;aspect-ratio:1/1;object-fit:cover;display:block;background:var(--surface-2)}
.cotw-ribbon{
  position:absolute;top:10px;left:10px;
  background:linear-gradient(135deg,var(--accent),#ff8a6b);color:var(--accent-ink);
  font-family:"Bricolage Grotesque",sans-serif;font-weight:800;font-size:.72rem;
  padding:5px 11px;border-radius:999px;box-shadow:0 6px 14px rgba(255,148,99,.35);
}
.cotw-info{padding:13px 3px 2px}
.cotw-name{font-family:"Bricolage Grotesque",sans-serif;font-weight:800;font-size:1.18rem;letter-spacing:-.01em}
.cotw-meta{font-size:.78rem;color:var(--muted);margin-top:2px}
.cotw-desc{font-size:.87rem;color:var(--text);margin-top:9px;line-height:1.5}
.cotw-by{font-size:.74rem;color:#6f6584;margin-top:10px}

/* twinkling stars/sparkles scattered around the panel */
.sparkle{
  position:absolute;pointer-events:none;z-index:1;
  color:var(--accent);opacity:.85;
  animation:twinkle 3.6s ease-in-out infinite;
}
.sparkle svg{display:block;filter:drop-shadow(0 0 4px rgba(255,180,84,.55))}
@keyframes twinkle{
  0%,100%{opacity:.25;transform:scale(.75) rotate(0deg)}
  50%{opacity:1;transform:scale(1.15) rotate(14deg)}
}

/* ---------- cat-of-the-week review modal (admin) ---------- */
.review-list{display:flex;flex-direction:column;gap:12px;max-height:60vh;overflow-y:auto;padding-right:4px}
.review-list::-webkit-scrollbar{width:6px}
.review-list::-webkit-scrollbar-thumb{background:#3d3350;border-radius:99px}
.review-row{display:flex;gap:13px;background:var(--surface-2);border:1px solid var(--line);border-radius:16px;padding:12px}
.review-row.is-featured{border-color:rgba(255,180,84,.4)}
.review-thumb{width:76px;height:76px;border-radius:12px;object-fit:cover;flex:none;background:var(--ink)}
.review-info{min-width:0;flex:1}
.review-name{font-weight:700;font-size:.95rem}
.review-sub{font-size:.76rem;color:var(--muted);margin:2px 0 6px}
.review-desc{font-size:.83rem;color:var(--text);max-height:54px;overflow:hidden;text-overflow:ellipsis}
.review-actions{display:flex;gap:8px;margin-top:9px;flex-wrap:wrap}
.review-status{font-size:.68rem;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--accent)}

@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<header class="topbar">
  <div class="topbar-inner">
    <div class="brand">
      <span class="brand-mark">🐈‍⬛</span>
      <span>
        <span class="brand-name">Feed a Goose</span>
        <span class="brand-sub" data-i18n="tagline"></span>
      </span>
    </div>

    <nav class="nav-icons">
      <a href="index.html" class="icon-btn" id="homeBtn" aria-label="Home">

<script>
/* ============================================================
   1. CAT FACES
   Avatars are drawn as SVG from an id like "ginger-tabby-gold",
   so there are dozens of combinations and nothing to upload.
   ============================================================ */
const FURS = {
  black:     {base:"#413c4c", dark:"#2c2836", light:"#565067", name:"Black"},
  charcoal:  {base:"#5a5566", dark:"#433f4e", light:"#726c80", name:"Charcoal"},
  grey:      {base:"#99a2ae", dark:"#7b838f", light:"#b4bcc7", name:"Grey"},
  bluegrey:  {base:"#8d9cb2", dark:"#6f7d93", light:"#a9b6c9", name:"Blue"},
  silver:    {base:"#c5cad0", dark:"#a3a9b1", light:"#dde1e6", name:"Silver"},
  white:     {base:"#efeae1", dark:"#cfc8bb", light:"#fbf8f3", name:"White"},
  cream:     {base:"#e8d5b0", dark:"#cbb489", light:"#f5e7cb", name:"Cream"},
  ginger:    {base:"#e2913f", dark:"#bf742a", light:"#f2ac63", name:"Ginger"},
  red:       {base:"#cd6a37", dark:"#a95324", light:"#e18855", name:"Red"},
  brown:     {base:"#8f6b4d", dark:"#6e5139", light:"#a98462", name:"Brown"},
  chocolate: {base:"#63473a", dark:"#4a342a", light:"#7d5d4c", name:"Chocolate"}
};
const PATTERNS = {
  solid:   "Solid",
  tabby:   "Tabby",
  tuxedo:  "Tuxedo",
  bicolor: "Bicolour",
  point:   "Point",
  calico:  "Patched"
};
const EYES = {
  gold:   "#ffc84a",
  green:  "#76d08a",
  blue:   "#7fc4f5",
  copper: "#d9884a"
};

let faceUid = 0;

function catFace(id){
  const parts = String(id || "ginger-tabby-gold").split("-");
  const fur = FURS[parts[0]] || FURS.ginger;
  const pat = parts[1] in PATTERNS ? parts[1] : "solid";
  const eye = EYES[parts[2]] || EYES.gold;

  const uid = "cf" + (faceUid++);
  const WHITE = "#f6f3ec";
  const earFill = pat === "point" ? fur.dark : fur.base;

  let marks = "";

  if(pat === "tabby"){
    marks += `
      <path d="M26 16 q1.6 6 0 11" stroke="${fur.dark}" stroke-width="2.6" fill="none" stroke-linecap="round"/>
      <path d="M32 14 q0 6 0 12" stroke="${fur.dark}" stroke-width="2.8" fill="none" stroke-linecap="round"/>
      <path d="M38 16 q-1.6 6 0 11" stroke="${fur.dark}" stroke-width="2.6" fill="none" stroke-linecap="round"/>
      <path d="M12 33 h8 M12 39 h7 M52 33 h-8 M52 39 h-7"
            stroke="${fur.dark}" stroke-width="2.2" stroke-linecap="round"/>`;
  }
  if(pat === "tuxedo"){
    marks += `
      <ellipse cx="32" cy="47" rx="14" ry="10" fill="${WHITE}"/>
      <path d="M32 15 L27 33 L32 39 L37 33 Z" fill="${WHITE}"/>`;
  }
  if(pat === "bicolor"){
    marks += `<path d="M0 0 H27 Q22 32 27 64 H0 Z" fill="${WHITE}"/>`;
  }
  if(pat === "point"){
    marks += `<ellipse cx="32" cy="41" rx="15" ry="13" fill="${fur.dark}" opacity=".85"/>`;
  }
  if(pat === "calico"){
    marks += `
      <ellipse cx="32" cy="42" rx="20" ry="16" fill="${WHITE}"/>
      <path d="M8 30 q10 -14 22 -6 q-6 10 -16 12 Z" fill="${fur.base}"/>
      <ellipse cx="46" cy="30" rx="11" ry="9" fill="${fur.dark}"/>
      <ellipse cx="38" cy="50" rx="8" ry="6" fill="${fur.light}"/>`;
  }

  return `<svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg" role="img">
    <defs><clipPath id="${uid}"><ellipse cx="32" cy="36" rx="22" ry="19"/></clipPath></defs>
    <path d="M10 32 L13 8 L30 20 Z" fill="${earFill}"/>
    <path d="M54 32 L51 8 L34 20 Z" fill="${earFill}"/>
    <path d="M14 27 L15.5 14 L25 21 Z" fill="#e79fae" opacity=".85"/>
    <path d="M50 27 L48.5 14 L39 21 Z" fill="#e79fae" opacity=".85"/>
    <ellipse cx="32" cy="36" rx="22" ry="19" fill="${fur.base}"/>
    <g clip-path="url(#${uid})">${marks}</g>
    <ellipse cx="32" cy="36" rx="22" ry="19" fill="none" stroke="rgba(0,0,0,.18)" stroke-width="1"/>
    <ellipse cx="23.5" cy="35" rx="4.7" ry="5.2" fill="${eye}"/>
    <ellipse cx="40.5" cy="35" rx="4.7" ry="5.2" fill="${eye}"/>
    <ellipse cx="23.5" cy="35" rx="1.5" ry="4.2" fill="#241d2c"/>
    <ellipse cx="40.5" cy="35" rx="1.5" ry="4.2" fill="#241d2c"/>
    <circle cx="22" cy="33" r="1.1" fill="#fff" opacity=".85"/>
    <circle cx="39" cy="33" r="1.1" fill="#fff" opacity=".85"/>
    <path d="M29.6 43.4 h4.8 L32 46.2 Z" fill="#e8909f"/>
    <path d="M32 46.2 v1.8 M32 48 q-2.4 2.4 -5.2 .6 M32 48 q2.4 2.4 5.2 .6"
          stroke="${fur.dark}" stroke-width="1.5" fill="none" stroke-linecap="round"/>
    <path d="M6 40 l10 -1.6 M6 45 l10 -3 M58 40 l-10 -1.6 M58 45 l-10 -3"
          stroke="rgba(255,255,255,.35)" stroke-width="1" stroke-linecap="round"/>
  </svg>`;
}

// Every selectable face, built from fur × pattern (eye colour rotates for variety)
const FACE_OPTIONS = (() => {
  const out = [];
  const furKeys = Object.keys(FURS);
  const patKeys = Object.keys(PATTERNS);
  const eyeKeys = Object.keys(EYES);
  furKeys.forEach((f, fi) => {
    patKeys.forEach((p, pi) => {
      const e = eyeKeys[(fi + pi) % eyeKeys.length];
      out.push({ id: `${f}-${p}-${e}`, label: `${FURS[f].name} ${PATTERNS[p]}` });
    });
  });
  return out;
})();

/* ---------- meow engine ---------- */
const MEOWS = {
  en:["meow","mew","mrow","meoww","mrrp","purr"],
  fr:["miaou","miaw","mrou","miaou","miaaou"],
  it:["miao","miau","mia","miaoo"],
  pt:["miau","miao","mianh","miauu"],
  pl:["miau","miał","miau","miauu"],
  sv:["mjau","mjao","mjau","jamm"],
  ru:["мяу","мяв","мур","мяуу"],
  zh:["喵","喵呜","喵喵","咪"],
  ja:["にゃー","にゃん","にゃあ","ニャー"]
};
const LOCALES = {en:"en-US",fr:"fr-FR",it:"it-IT",pt:"pt-BR",pl:"pl-PL",sv:"sv-SE",ru:"ru-RU",zh:"zh-CN",ja:"ja-JP"};
const NO_PERIOD = ["zh","ja"];

function hash(str){
  let h = 2166136261;
  for(let i=0;i<str.length;i++){ h ^= str.charCodeAt(i); h = Math.imul(h,16777619); }
  return h >>> 0;
}

function meowify(text, lang, seed){
  const bank = MEOWS[lang] || MEOWS.en;
  const raw  = (text || "").trim();
  if(!raw) return bank[0];
  const words = raw.split(/\s+/).filter(Boolean).slice(0, 45);
  const out = words.map((w,i) => bank[ hash(seed + "|" + i + "|" + w.length) % bank.length ]);
  let line = out.join(" ");
  const tail = raw.match(/[!?！？…~]+$/);
  line += tail ? tail[0] : (NO_PERIOD.includes(lang) ? "" : ".");
  if(!NO_PERIOD.includes(lang)) line = line.charAt(0).toUpperCase() + line.slice(1);
  return line;
}

const State = {
  lang: localStorage.getItem("goose_lang") || "en",
  me: null,
  posts: [],
  profiles: {},
  human: new Set(),
  queue: [],
  serving: null,
  lastTicket: 0,
  draft: {},              // sign-up wizard answers
  avatar: "ginger-tabby-gold",
  cotw: null
};
const t = () => I18N[State.lang];

function esc(s){
  return String(s ?? "").replace(/[&<>'"]/g, c => (
    {"&":"&amp;","<":"&lt;",">":"&gt;","'":"&#39;",'"':"&quot;"}[c]
  ));
}
function toast(msg, kind=""){
  const el = document.createElement("div");
  el.className = "toast " + kind;
  el.textContent = msg;
  document.getElementById("toasts").appendChild(el);
  setTimeout(() => el.remove(), 3600);
}
function when(ts){
  const d = new Date(ts.includes("Z") || ts.includes("T") ? ts : ts.replace(" ", "T") + "Z");
  if(isNaN(d)) return "";
  return new Intl.DateTimeFormat(LOCALES[State.lang], {day:"numeric",month:"short",hour:"2-digit",minute:"2-digit"}).format(d);
}
function avatarOf(username, fallback){
  const p = State.profiles[username];
  return (p && p.avatar) || fallback || "ginger-tabby-gold";
}
function ageOf(birthday){
  if(!birthday) return null;
  const b = new Date(birthday);
  if(isNaN(b)) return null;
  const now = new Date();
  let y = now.getFullYear() - b.getFullYear();
  const m = now.getMonth() - b.getMonth();
  if(m < 0 || (m === 0 && now.getDate() < b.getDate())) y--;
  return Math.max(0, y);
}
const isMine = username => State.me && State.me.loggedIn && State.me.username === username;
const canModerate = () => State.me && State.me.isAdmin;

    if(typeof v === "string") el.textContent = v;
  });
  document.querySelectorAll("[data-ph]").forEach(el => { el.placeholder = t()[el.dataset.ph] || ""; });
  document.getElementById("treatSub").textContent = t().dispenseSub;
  fillDropdowns();
  renderComposer();
  renderFeed();
  renderSession();
  renderQueue();
  refreshTreatButton();
  renderCotw(State.cotw);
}

function renderComposer(){
  const box = document.getElementById("composer");
  if(!State.me || !State.me.loggedIn){
    box.innerHTML = `<div class="locked"><span>${esc(t().lockedMsg)}</span>
      <button class="btn btn-primary btn-sm" onclick="openRegister()">${esc(t().signUp)}</button></div>`;
    return;
  }
  box.innerHTML = `
    <form id="postForm" onsubmit="submitPost(event)">
      <textarea name="content" placeholder="${esc(t().composerPh)}" required></textarea>
      <div class="composer-row">
        <span class="file-btn">
          <button type="button" class="btn btn-ghost btn-sm">📷 ${esc(t().addPhoto)}</button>
          <input type="file" name="image" accept="image/*" onchange="document.getElementById('fileName').textContent = this.files[0] ? this.files[0].name : ''">
        </span>
        <span class="file-name" id="fileName"></span>
        <span class="spacer"></span>
        <button type="submit" class="btn btn-primary btn-sm">${esc(t().post)}</button>
      </div>
    </form>`;
}

function renderFeed(){
  const feed = document.getElementById("feed");
  document.getElementById("feedNote").textContent = t().feedNote(State.posts.length);

  if(!State.posts.length){
    feed.innerHTML = `<div class="empty"><span class="big">🐾</span>
      <strong>${esc(t().emptyTitle)}</strong><br>${esc(t().emptySub)}</div>`;
    return;
  }

  feed.innerHTML = State.posts.map(p => {
    const showHuman = State.human.has(p.id);
    const canDelPost = isMine(p.username) || canModerate();

    const comments = (p.comments || []).map(c => {
      const canDelC = isMine(c.username) || canModerate();
      return `
      <div class="comment" id="comment-${c.id}">
        <span class="c-avatar">${catFace(avatarOf(c.username, c.avatar))}</span>
        <div class="c-body">
          <div class="c-name" data-user="${esc(c.username)}">${esc(c.username)}</div>
          <div class="c-text">${esc(meowify(c.content, State.lang, "c" + c.id))}</div>
        </div>
        ${canDelC ? `<button class="c-del" onclick="deleteComment(${c.id})" title="${esc(t().del)}">🗑</button>` : ""}
      </div>`;
    }).join("");

    return `
      <article class="post" id="post-${p.id}">
        <div class="post-top">
          <span class="avatar">${catFace(avatarOf(p.username, p.avatar))}</span>
          <div class="post-who">
            <div class="post-author" data-user="${esc(p.username)}">${esc(p.username)}</div>
            <div class="post-time">${esc(when(p.timestamp))}</div>
          </div>
        </div>
        <div class="meows">${esc(meowify(p.content, State.lang, "post" + p.id))}</div>
        ${showHuman ? `<div class="human">${esc(p.content)}</div>` : ""}
        ${p.image_url ? `<img class="post-img" src="${esc(p.image_url)}" alt="" loading="lazy">` : ""}
        <div class="post-bar">
          <button class="act ${p.user_has_liked ? "on" : ""}" onclick="like(${p.id})">
            ${p.user_has_liked ? "❤️" : "🤍"} ${esc(t().like)} ${p.total_likes ? "· " + p.total_likes : ""}
          </button>
          ${canDelPost ? `<button class="act danger" onclick="deletePost(${p.id})">🗑 ${esc(t().del)}</button>` : ""}
          <button class="act subtle" onclick="toggleHuman(${p.id})">${esc(showHuman ? t().hideHuman : t().showHuman)}</button>
        </div>
        <div class="comments">
          ${comments}
          ${State.me && State.me.loggedIn ? `
          <form class="c-form" onsubmit="submitComment(event, ${p.id})">
            <input name="content" placeholder="${esc(t().commentPh)}" required>
            <button type="submit" class="btn btn-ghost btn-sm">${esc(t().send)}</button>
          </form>` : ""}
        </div>
      </article>`;
  }).join("");
}

function renderSession(){
  const out = document.getElementById("zoneOut");
  const inn = document.getElementById("zoneIn");
  if(State.me && State.me.loggedIn){
    out.style.display = "none";
    inn.style.display = "inline-flex";
    document.getElementById("userBadge").innerHTML =

    out.style.display = "inline-flex";
    inn.style.display = "none";

  }
}

function setStatus(text, kind=""){
  const el = document.getElementById("feederStatus");
  el.className = "feeder-status " + kind;
  el.innerHTML = `<span class="sdot"></span><span></span>`;
  el.lastElementChild.textContent = text;

function toggleHuman(id){

  renderFeed();
}

/* ============================================================
   5. HOVER PROFILE CARD
   ============================================================ */
const card = () => document.getElementById("profileCard");

function showProfileCard(username, anchor){
  const p = State.profiles[username];
  const box = card();

  const rows = [];
  if(p){
    if(p.breed)    rows.push([t().pcBreed, p.breed]);
    const age = ageOf(p.birthday);
    if(age !== null) rows.push([t().pcAge, t().years(age)]);
    if(p.country)  rows.push([t().pcCountry, p.country]);
    if(p.fav_food) rows.push([t().pcFood, p.fav_food]);
  }

  box.innerHTML = `
    <div class="pc-top">
      <span class="big-face">${catFace(p ? p.avatar : "ginger-tabby-gold")}</span>
      <span>
        <div class="pc-name">${esc((p && p.cat_name) || username)}</div>
        <div class="pc-handle">@${esc(username)}${p && p.is_admin ? " · " + esc(t().modTag) : ""}</div>
      </span>
    </div>
    ${rows.length
      ? `<div class="pc-rows">${rows.map(([k,v]) =>
          `<div class="pc-row"><span class="k">${esc(k)}</span><span class="v">${esc(v)}</span></div>`).join("")}</div>`
      : `<div class="pc-empty">${esc(t().noProfile)}</div>`}`;

  const r = anchor.getBoundingClientRect();
  box.classList.add("show");
  const w = box.offsetWidth, h = box.offsetHeight;
  let left = r.left;
  let top  = r.bottom + 9;
  if(left + w > window.innerWidth - 12) left = window.innerWidth - w - 12;
  if(top + h > window.innerHeight - 12) top = r.top - h - 9;
  box.style.left = Math.max(12, left) + "px";
  box.style.top  = Math.max(12, top) + "px";
}
function hideProfileCard(){ card().classList.remove("show"); }

document.addEventListener("mouseover", e => {
  const el = e.target.closest("[data-user]");
  if(el) showProfileCard(el.dataset.user, el);
});
document.addEventListener("mouseout", e => {
  if(e.target.closest("[data-user]")) hideProfileCard();
});
document.addEventListener("click", e => {
  const el = e.target.closest("[data-user]");   // tap works on touch screens
  if(el){ showProfileCard(el.dataset.user, el); setTimeout(hideProfileCard, 4000); }
});
window.addEventListener("scroll", hideProfileCard, {passive:true});

/* ============================================================
   6. SERVER CALLS
   ============================================================ */
async function loadProfiles(){
  try{
    const r = await fetch("/api/profiles");
    const d = await r.json();
    if(d.status === "Success") State.profiles = d.profiles || {};
  }catch(e){}
}
async function loadWall(){
  try{
    const r = await fetch("/api/posts");
    const d = await r.json();
    State.posts = d.status === "Success" ? d.posts : [];
  }catch(e){ State.posts = []; }
  renderFeed();
}
async function checkSession(){
  try{
    const r = await fetch("/api/me");
    State.me = await r.json();
  }catch(e){ State.me = null; }
  renderSession();
  renderComposer();
}

async function doLogin(event){
  event.preventDefault();
  const data = Object.fromEntries(new FormData(event.target));
  try{
    const r = await fetch("/login", {method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify(data)});
    const d = await r.json();
    toast(d.message || "…", r.ok ? "good" : "bad");
    if(r.ok){
      event.target.reset();
      closeModals();
      await checkSession();
      await loadProfiles();
      loadWall();
    }
  }catch(e){ toast(t().netErr, "bad"); }
}

async function logout(){
  try{
    await fetch("/logout", {method:"POST"});
    State.me = null;
    State.human.clear();
    renderSession(); renderComposer(); loadWall();
  }catch(e){ toast(t().netErr, "bad"); }
}

async function submitPost(event){
  event.preventDefault();
  const form = event.target;
  const btn = form.querySelector("button[type=submit]");
  btn.disabled = true;
  try{
    const r = await fetch("/api/posts", {method:"POST", body:new FormData(form)});
    const d = await r.json();
    if(!r.ok) throw new Error(d.message);
    form.reset();
    loadWall();
  }catch(e){ toast(e.message || t().netErr, "bad"); }
  finally{ btn.disabled = false; }
}

async function like(postId){
  if(!State.me || !State.me.loggedIn) return toast(t().needLogin, "bad");
  try{
    const r = await fetch(`/api/posts/${postId}/like`, {method:"POST"});
    if(r.status === 401) return toast(t().needLogin, "bad");
    loadWall();
  }catch(e){ toast(t().netErr, "bad"); }
}

async function submitComment(event, postId){
  event.preventDefault();
  const form = event.target;
  const input = form.querySelector("input[name=content]");
  try{
    const r = await fetch(`/api/posts/${postId}/comments`, {
      method:"POST", headers:{"Content-Type":"application/json"},
      body:JSON.stringify({content: input.value})
    });
    const d = await r.json();
    if(!r.ok) throw new Error(d.message);
    form.reset();
    loadWall();
  }catch(e){ toast(e.message || t().netErr, "bad"); }
}

async function deletePost(id){
  if(!confirm(t().confirmPost)) return;
  try{
    const r = await fetch(`/api/posts/${id}`, {method:"DELETE"});
    const d = await r.json();
    if(!r.ok){
      return toast(d.code === "not_yours" ? t().notYours : (d.message || t().netErr), "bad");
    }
    const el = document.getElementById("post-" + id);
    if(el) el.classList.add("leaving");
    toast(t().deleted, "good");
    setTimeout(loadWall, 200);
  }catch(e){ toast(t().netErr, "bad"); }
}

async function deleteComment(id){
  if(!confirm(t().confirmComment)) return;
  try{
    const r = await fetch(`/api/comments/${id}`, {method:"DELETE"});
    const d = await r.json();
    if(!r.ok){
      return toast(d.code === "not_yours" ? t().notYours : (d.message || t().netErr), "bad");
    }
    toast(t().deleted, "good");
    loadWall();
  }catch(e){ toast(t().netErr, "bad"); }
}

function fillDropdowns(){
  const breed = document.getElementById("regBreed");
  const country = document.getElementById("regCountry");
  if(!breed || !country) return;
  const keepB = breed.value, keepC = country.value;
  breed.innerHTML = `<option value="" disabled selected>${esc(t().chooseBreed)}</option>` +
    BREEDS.map(b => `<option value="${esc(b)}">${esc(b)}</option>`).join("");
  country.innerHTML = `<option value="" disabled selected>${esc(t().chooseCountry)}</option>` +
    COUNTRIES.map(c => `<option value="${esc(c)}">${esc(c)}</option>`).join("");
  if(keepB) breed.value = keepB;
  if(keepC) country.value = keepC;
}

function buildFaceGrid(){
  const grid = document.getElementById("faceGrid");
  grid.innerHTML = FACE_OPTIONS.map(o => `
    <button type="button" class="face-opt${o.id === State.avatar ? " sel" : ""}"
            data-face="${o.id}" title="${esc(o.label)}" onclick="pickFace('${o.id}')">
      ${catFace(o.id)}
    </button>`).join("");
  paintPicked();
}
function pickFace(id){
  State.avatar = id;
  document.querySelectorAll(".face-opt").forEach(b => b.classList.toggle("sel", b.dataset.face === id));
  paintPicked();
}
function paintPicked(){
  const opt = FACE_OPTIONS.find(o => o.id === State.avatar);
  document.getElementById("pickedFace").innerHTML = catFace(State.avatar);
  document.getElementById("pickedLabel").textContent = opt ? opt.label : "";
}

function showStep(n){
  [1,2,3].forEach(i => {
    document.getElementById("step" + i).style.display = (i === n) ? "" : "none";
    document.getElementById("pip" + i).classList.toggle("on", i <= n);
  });
}
function openRegister(){
  showStep(1);
  fillDropdowns();
  buildFaceGrid();
  openModal("register");
}
function goStep2(event){
  event.preventDefault();
  const pass = document.getElementById("regPass").value;
  if(pass !== document.getElementById("regConfirm").value) return toast(t().mismatch, "bad");
  State.draft.username = document.getElementById("regUser").value.trim();
  State.draft.email    = document.getElementById("regEmail").value.trim();
  State.draft.password = pass;
  showStep(2);
}
function goStep3(event){
  event.preventDefault();
  State.draft.cat_name = document.getElementById("regCatName").value.trim();
  State.draft.breed    = document.getElementById("regBreed").value;
  State.draft.birthday = document.getElementById("regBirthday").value;
  State.draft.country  = document.getElementById("regCountry").value;
  State.draft.fav_food = document.getElementById("regFood").value.trim();
  showStep(3);
}
async function finishRegister(){
  const payload = Object.assign({}, State.draft, { avatar: State.avatar });
  try{
    const r = await fetch("/register", {
      method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify(payload)
    });
    const d = await r.json();
    toast(d.message || "…", r.ok ? "good" : "bad");
    if(r.ok){
      State.draft = {};
      closeModals();
      document.querySelectorAll("#modal-register input").forEach(i => i.value = "");
      await checkSession();
      await loadProfiles();
      loadWall();
    }
  }catch(e){ toast(t().netErr, "bad"); }
}

   ============================================================ */
const MOTOR_MS = 3000;
const POLL_MS  = 1200;
const NEON = ["#ffb454","#6ef0c0","#7cc7ff","#ff8fd0","#c79bff","#ffe066","#5ef2d0","#ff9a6b"];
const colourFor = name => NEON[hash(name || "anon") % NEON.length];

function fillBar(ms){
  const fill = document.getElementById("treatFill");
  fill.classList.remove("running");
  fill.style.transitionDuration = "0ms";
  fill.style.transform = "scaleX(1)";
  requestAnimationFrame(() => {
    fill.classList.add("running");
    fill.style.transitionDuration = ms + "ms";
    fill.style.transform = "scaleX(0)";
  });
}

function renderQueue(){
  const list = document.getElementById("queueList");
  const rows = [];
  if(State.serving){
    const c = colourFor(State.serving.username);
    rows.push(`<div class="q-row serving">
      <span class="who" data-user="${esc(State.serving.username)}" style="color:${c};text-shadow:0 0 12px ${c}66">${esc(State.serving.username)}</span>
      <span class="said">${esc(t().feedingNow)}</span><span class="motor">🐟</span></div>`);
  }
  State.queue.forEach(entry => {
    const c = colourFor(entry.username);
    rows.push(`<div class="q-row">
      <span class="who" data-user="${esc(entry.username)}" style="color:${c};text-shadow:0 0 12px ${c}66">${esc(entry.username)}</span>
      <span class="said">${esc(t().inLineFor)}</span><span class="pos">${entry.position}</span></div>`);
  });
  document.getElementById("queueCount").textContent = State.queue.length + (State.serving ? 1 : 0);
  list.innerHTML = rows.length ? rows.join("") : `<div class="queue-empty">${esc(t().queueEmpty)}</div>`;
}

function refreshTreatButton(){
  const btn = document.getElementById("treatBtn");
  const sub = document.getElementById("treatSub");
  const me = (State.me && State.me.loggedIn) ? State.me.username : null;

  if(State.serving && me && State.serving.username === me){
    btn.disabled = true; sub.textContent = t().yourTurn; return;
  }
  const mine = State.queue.find(e => e.username === me);
  if(mine){ btn.disabled = true; sub.textContent = t().queuedSub(mine.position); return; }
  btn.disabled = false;
  sub.textContent = t().dispenseSub;
}

async function pollQueue(){
  try{
    const r = await fetch("/api/queue");
    const d = await r.json();
    const wasServingMe = State.serving && State.me && State.serving.username === State.me.username;

    State.serving = d.serving;
    State.queue = d.queue || [];

    const drops = (d.recent || []).filter(x => x.ticket > State.lastTicket);
    if(State.lastTicket === 0){
      State.lastTicket = (d.recent && d.recent.length) ? d.recent[0].ticket : 0;
    }else if(drops.length){
      drops.sort((a,b) => a.ticket - b.ticket).forEach(drop => {
        toast(t().thanks(drop.username), "good");
        State.lastTicket = Math.max(State.lastTicket, drop.ticket);
      });
      setStatus(t().ready);
      checkSession();
    }

    const servingMe = State.serving && State.me && State.serving.username === State.me.username;
    if(servingMe && !wasServingMe){ fillBar(MOTOR_MS); setStatus(t().yourTurn, "warn"); }

    renderQueue();
    refreshTreatButton();
  }catch(e){}
}

async function dispense(){
  if(!State.me || !State.me.loggedIn){ openModal("login"); return toast(t().needLogin, "bad"); }
  document.getElementById("treatBtn").disabled = true;
  try{
    const r = await fetch("/dispense");
    const d = await r.json();
    if(d.status === "Success"){
      if(typeof d.remainingTokens === "number"){ State.me.tokens = d.remainingTokens; renderSession(); }
      toast(t().joined, "good");
      setStatus(t().joined, "warn");
    }else{
      const msg = d.code === "already_queued" ? t().alreadyQueued
                : d.code === "no_tokens"      ? t().noTokens
                : (d.message || t().offline);
      toast(msg, "bad"); setStatus(msg, "err");
    }
  }catch(e){ toast(t().offline, "bad"); setStatus(t().offline, "err"); }
  pollQueue();
}

/* ============================================================
   CAT OF THE WEEK
   ============================================================ */
// A handful of stable-but-scattered sparkle positions around the panel
const SPARKLE_SPOTS = [
  {top:"6%", left:"8%",  size:14, delay:"0s"},
  {top:"14%",left:"88%", size:10, delay:".6s"},
  {top:"46%",left:"4%",  size:9,  delay:"1.3s"},
  {top:"78%",left:"92%", size:13, delay:"1.9s"},
  {top:"90%",left:"12%", size:10, delay:"2.4s"},
  {top:"58%",left:"95%", size:8,  delay:".2s"}
];
function sparkleSvg(size){
  return `<svg width="${size}" height="${size}" viewBox="0 0 24 24" fill="currentColor">
    <path d="M12 0 L14.2 9.8 24 12 14.2 14.2 12 24 9.8 14.2 0 12 9.8 9.8 Z"/></svg>`;
}
function sparkleLayer(){
  return SPARKLE_SPOTS.map(s =>
    `<span class="sparkle" style="top:${s.top};left:${s.left};animation-delay:${s.delay}">${sparkleSvg(s.size)}</span>`
  ).join("");
}

async function loadCotw(){
  try{
    const r = await fetch("/api/cat-of-week/current");
    const d = await r.json();
    State.cotw = d.status === "Success" ? d.cat : null;
  }catch(e){ State.cotw = null; }
  renderCotw(State.cotw);
}

function renderCotw(cat){
  const box = document.getElementById("cotwBody");
  if(!cat){
    box.innerHTML = `<div class="cotw-empty">${State.me && State.me.loggedIn ? t().cotwEmptyView : t().cotwEmptyBoth}</div>` + sparkleLayer();
    return;
  }
  const meta = [cat.breed, cat.age].filter(Boolean).join(" · ");
  box.innerHTML = `
    ${sparkleLayer()}
    <div class="cotw-card">
      <div class="cotw-frame">
        <img class="cotw-photo" src="${esc(cat.photo_url)}" alt="${esc(cat.cat_name)}" loading="lazy">
        <span class="cotw-ribbon">${esc(t().cotwCrown)}</span>
      </div>
      <div class="cotw-info">
        <div class="cotw-name">${esc(cat.cat_name)}</div>
        ${meta ? `<div class="cotw-meta">${esc(meta)}</div>` : ""}
        <div class="cotw-desc">${esc(cat.description)}</div>
        <div class="cotw-by">${esc(t().cotwSubmittedBy(cat.username))}</div>
      </div>
    </div>`;
}

/* ---------- admin review modal ---------- */
async function openReview(){
  openModal("review");
  const list = document.getElementById("reviewList");
  list.innerHTML = `<div class="cotw-empty">${esc(t().loading)}</div>`;
  try{
    const r = await fetch("/api/admin/cat-of-week");
    const d = await r.json();
    if(d.status !== "Success") throw new Error(d.message);
    renderReviewList(d.submissions || []);
  }catch(e){
    list.innerHTML = `<div class="cotw-empty">${esc(t().netErr)}</div>`;
  }
}

function renderReviewList(subs){
  const list = document.getElementById("reviewList");
  if(!subs.length){
    list.innerHTML = `<div class="cotw-empty">${esc(t().reviewEmpty)}</div>`;
    return;
  }
  list.innerHTML = subs.map(s => {
    const meta = [s.breed, s.age].filter(Boolean).join(" · ");
    const isFeatured = s.status === "featured";
    return `
    <div class="review-row ${isFeatured ? "is-featured" : ""}">
      <img class="review-thumb" src="${esc(s.photo_url)}" alt="${esc(s.cat_name)}">
      <div class="review-info">
        ${isFeatured ? `<div class="review-status">${esc(t().featured)}</div>` : ""}
        <div class="review-name">${esc(s.cat_name)}${meta ? " · " + esc(meta) : ""}</div>
        <div class="review-sub">${esc(t().cotwSubmittedBy(s.username))}${s.featured_at ? " · " + esc(t().crowned(when(s.featured_at))) : ""}</div>
        <div class="review-desc">${esc(s.description)}</div>
        <div class="review-actions">
          ${!isFeatured ? `<button class="btn btn-primary btn-sm" onclick="featureSubmission(${s.id})">${esc(t().feature)}</button>` : ""}
          <button class="btn btn-ghost btn-sm" onclick="rejectSubmission(${s.id})">${esc(t().reject)}</button>
        </div>
      </div>
    </div>`;
  }).join("");
}

async function featureSubmission(id){
  try{
    const r = await fetch(`/api/admin/cat-of-week/${id}/feature`, {method:"POST"});
    const d = await r.json();
    if(!r.ok) throw new Error(d.message);
    toast(d.message, "good");
    openReview();
    loadCotw();
  }catch(e){ toast(e.message || t().netErr, "bad"); }
}

async function rejectSubmission(id){
  if(!confirm(t().confirmPost)) return;
  try{
    const r = await fetch(`/api/admin/cat-of-week/${id}`, {method:"DELETE"});
    const d = await r.json();
    if(!r.ok) throw new Error(d.message);
    toast(d.message, "good");
    openReview();
    loadCotw();
  }catch(e){ toast(e.message || t().netErr, "bad"); }
}


/* ---------- modals ---------- */
function openModal(which){ document.getElementById("modal-" + which).classList.add("open"); }
function closeModals(){ document.querySelectorAll(".overlay").forEach(o => o.classList.remove("open")); }
document.addEventListener("keydown", e => { if(e.key === "Escape") closeModals(); });

/* ============================================================
   9. BOOT
   ============================================================ */
document.getElementById("langSelect").addEventListener("change", e => {
  State.lang = e.target.value;
  localStorage.setItem("goose_lang", State.lang);
  applyLanguage();
});

window.addEventListener("DOMContentLoaded", async () => {
  document.getElementById("langSelect").value = State.lang;
  applyLanguage();
  buildFaceGrid();
  await checkSession();
  await loadProfiles();
  loadWall();
  loadCotw();
  pollQueue();
  setInterval(pollQueue, POLL_MS);
  setInterval(async () => { await loadProfiles(); loadWall(); }, 30000);
  setInterval(loadCotw, 60000);
});
</script>
